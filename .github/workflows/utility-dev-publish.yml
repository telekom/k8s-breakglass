name: Development utility images

# A push to a dev-images/* branch is intentional: unlike workflow_dispatch,
# GitHub evaluates this workflow from the pushed ref. The branch prefix is the
# only publication trigger and normal CI does not run for these branches.
on:
  push:
    branches:
      - 'dev-images/**'
    paths:
      - 'utils/**'
      - 'cmd/cluster-validator/**'
      - 'pkg/clustervalidator/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.validator'
      - 'hack/cluster-validator-*'
      - '.github/workflows/utility-dev-publish.yml'

permissions:
  contents: read

concurrency:
  group: development-utility-publication-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: telekom/k8s-breakglass

jobs:
  validate-trigger:
    name: Validate development publication trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject unexpected repository, event, or ref
        env:
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_PROTECTED: ${{ github.ref_protected }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_SENDER_TYPE: ${{ github.event.sender.type }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOWED_ACTORS: ${{ vars.UTILITY_DEV_ALLOWED_ACTORS }}
          # This is a repository identity, not an environment or customer
          # assumption. A fork cannot publish to the canonical GHCR namespace.
          REPO_EXPECTED: telekom/k8s-breakglass
        run: |
          set -Eeuo pipefail
          [[ "${EVENT_NAME}" == push ]] || { echo "unexpected event" >&2; exit 1; }
          [[ "${REPOSITORY}" == "${REPO_EXPECTED}" ]] || { echo "unexpected repository" >&2; exit 1; }
          [[ "${EVENT_REPOSITORY}" == "${REPO_EXPECTED}" ]] || { echo "unexpected event repository" >&2; exit 1; }
          [[ "${EVENT_REF_TYPE}" == branch ]] || { echo "publication requires a branch ref" >&2; exit 1; }
          [[ "${EVENT_REF_PROTECTED}" == true ]] || {
            echo "dev-images branches must be protected before publication" >&2
            exit 1
          }
          [[ "${EVENT_REF}" =~ ^refs/heads/dev-images/[a-z0-9][a-z0-9._/-]*[a-z0-9]$ ]] || {
            echo "publication ref is outside dev-images/*" >&2
            exit 1
          }
          git check-ref-format --branch "${EVENT_REF#refs/heads/}" >/dev/null || {
            echo "publication ref is not a valid Git ref" >&2
            exit 1
          }
          [[ -n "${ACTOR}" && "${EVENT_SENDER}" == "${ACTOR}" && "${EVENT_SENDER_TYPE}" == User ]] || {
            echo "event sender and actor do not match" >&2
            exit 1
          }
          [[ -n "${TRIGGERING_ACTOR}" && -n "${ALLOWED_ACTORS}" ]] || {
            echo "publisher allowlist and triggering actor are required" >&2
            exit 1
          }
          for candidate in "${ACTOR}" "${TRIGGERING_ACTOR}"; do
            case ",${ALLOWED_ACTORS}," in
              *,"${candidate}",*) ;;
              *) echo "actor ${candidate} is not an approved development publisher" >&2; exit 1 ;;
            esac
          done

  environment-preflight:
    name: Verify live publication environment protection
    needs: validate-trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required reviewers and self-review prevention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { data } = await github.rest.repos.getEnvironment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment_name: 'utility-development',
            });
            const valid = (data.protection_rules || []).some((rule) =>
              rule.type === 'required_reviewers' &&
              Array.isArray(rule.reviewers) &&
              rule.reviewers.length > 0 &&
              rule.prevent_self_review === true
            );
            if (!valid) {
              core.setFailed('utility-development lacks required reviewers or prevent-self-review');
            }

  publication-approval:
    name: Approve development publication
    needs: [validate-trigger, environment-preflight]
    runs-on: ubuntu-latest
    environment: utility-development
    permissions: {}
    steps:
      - name: Record approval gate
        run: echo "development publication was approved for ${GITHUB_SHA}"

  utility-images:
    name: Publish ${{ matrix.name }} development image
    needs: publication-approval
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workload-debug
            path: utils/workload-debug
            file: Dockerfile
          - name: network-debug
            path: utils/network-debug
            file: Dockerfile
          - name: storage-debug
            path: utils/images/storage-debug
            file: Dockerfile
          - name: dump-reader
            path: utils/images/dump-reader
            file: Dockerfile
          - name: node-maintenance
            path: utils/node-maintenance
            file: Dockerfile
          - name: cluster-validator
            path: .
            file: utils/cluster-validator/Dockerfile
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "${actual_sha}" == "${EXPECTED_SHA}" ]] || {
            echo "checkout ${actual_sha} does not match pushed commit ${EXPECTED_SHA}" >&2
            exit 1
          }
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GitHub did not provide a full commit SHA" >&2
            exit 1
          }

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create collision-safe development tag
        id: metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -Eeuo pipefail
          [[ "${RUN_ID}" =~ ^[0-9]+$ && "${RUN_ATTEMPT}" =~ ^[0-9]+$ ]] || {
            echo "invalid GitHub run identity" >&2
            exit 1
          }
          tag="dev-${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          image="${REGISTRY}/${REPOSITORY}/${IMAGE_NAME}"
          probe_output="$(mktemp)"
          probe_error="$(mktemp)"
          trap 'rm -f "${probe_output}" "${probe_error}"' EXIT
          set +e
          docker buildx imagetools inspect "${image}:${tag}" >"${probe_output}" 2>"${probe_error}"
          probe_status=$?
          set -e
          if [[ "${probe_status}" -eq 0 ]]; then
            echo "refusing to overwrite existing development tag ${image}:${tag}" >&2
            exit 1
          fi
          # A failed registry probe is an acceptable absence only when the
          # registry returned a manifest-not-found response. Authentication,
          # rate-limit, DNS, TLS, and all other failures fail closed.
          if ! grep -Eiq 'manifest unknown|MANIFEST_UNKNOWN|no such manifest|status code:[[:space:]]*404|unexpected status from HEAD request.*404' "${probe_error}"; then
            echo "could not prove that ${image}:${tag} is absent; refusing publication" >&2
            cat "${probe_error}" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "image=${image}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and push six-tool multi-architecture image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_DIR: ${{ matrix.path }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -Eeuo pipefail
          build_date="$(git show -s --format=%cI "${SOURCE_SHA}")"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "${SOURCE_DIR}/${DOCKERFILE}" \
            --tag "${IMAGE}:${TAG}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --build-arg VERSION="${TAG}" \
            --build-arg VCS_REF="${SOURCE_SHA}" \
            --build-arg GIT_COMMIT="${SOURCE_SHA}" \
            --build-arg BUILD_DATE="${build_date}" \
            "${SOURCE_DIR}"

      - name: Resolve and verify immutable multi-architecture digest
        id: resolve
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -Eeuo pipefail
          digest=""
          for attempt in $(seq 1 30); do
            inspect_output="$(mktemp)"
            inspect_error="$(mktemp)"
            set +e
            docker buildx imagetools inspect "${IMAGE}:${TAG}" >"${inspect_output}" 2>"${inspect_error}"
            inspect_status=$?
            set -e
            if [[ "${inspect_status}" -eq 0 ]]; then
              digest="$(awk '/^Digest:[[:space:]]+sha256:[0-9a-f]{64}$/ {print $2; exit}' "${inspect_output}")"
            else
              echo "registry digest probe failed on attempt ${attempt}; retrying" >&2
              cat "${inspect_error}" >&2
            fi
            rm -f "${inspect_output}" "${inspect_error}"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            sleep 2
          done
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "unable to resolve immutable digest" >&2
            exit 1
          }
          subject="${IMAGE}@${digest}"
          docker buildx imagetools inspect --raw "${subject}" >"${RUNNER_TEMP}/manifest.json"
          jq -e '
            (.manifests | type == "array") and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1) and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)
          ' "${RUNNER_TEMP}/manifest.json" >/dev/null
          {
            echo "digest=${digest}"
            echo "subject=${subject}"
          } >>"${GITHUB_OUTPUT}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.resolve.outputs.subject }}
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          upload-release-assets: false

      - name: Keylessly sign and attest immutable image
        env:
          SUBJECT: ${{ steps.resolve.outputs.subject }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -Eeuo pipefail
          [[ "${SUBJECT}" == "${IMAGE}@${DIGEST}" ]] || { echo "subject mismatch" >&2; exit 1; }
          cosign sign --yes "${SUBJECT}"
          cosign attest --yes --type spdxjson --predicate "${{ matrix.name }}.spdx.json" "${SUBJECT}"
          jq -n --arg sha "${SOURCE_SHA}" --arg workflow "${WORKFLOW_IDENTITY}" \
            '{buildDefinition:{buildType:"https://github.com/telekom/k8s-breakglass/.github/workflows/utility-dev-publish.yml",externalParameters:{source:{uri:"https://github.com/telekom/k8s-breakglass",digest:{sha1:$sha}}},resolvedDependencies:[]},runDetails:{builder:{id:$workflow}}}' \
            >"${{ matrix.name }}.provenance.json"
          cosign attest --yes --type slsaprovenance1 --predicate "${{ matrix.name }}.provenance.json" "${SUBJECT}"
          cosign verify "${SUBJECT}" \
            --certificate-identity="${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          cosign verify-attestation "${SUBJECT}" --type spdxjson \
            --certificate-identity="${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          cosign verify-attestation "${SUBJECT}" --type slsaprovenance1 \
            --certificate-identity="${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          cosign verify-attestation "${SUBJECT}" --type slsaprovenance1 \
            --certificate-identity="${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --output json >"${{ matrix.name }}.slsa-attestation.json"
          hack/verify-slsa-provenance.sh "${{ matrix.name }}.slsa-attestation.json" "${SUBJECT}" \
            "https://github.com/telekom/k8s-breakglass/.github/workflows/utility-dev-publish.yml" \
            "https://github.com/telekom/k8s-breakglass" "${SOURCE_SHA}" \
            "${WORKFLOW_IDENTITY}"
          printf '%s|%s|%s\n' '${{ matrix.name }}' "${IMAGE}" "${DIGEST}" >"${{ matrix.name }}.ref"
          jq -n \
            --arg name '${{ matrix.name }}' \
            --arg image "${IMAGE}" \
            --arg tag "${{ steps.metadata.outputs.tag }}" \
            --arg digest "${DIGEST}" \
            --arg source "${GITHUB_SHA}" \
            --arg workflow "${GITHUB_WORKFLOW_REF}" \
            --arg identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            '{name:$name,image:$image,tag:$tag,digest:$digest,sourceSha:$source,workflowRef:$workflow,workflowIdentity:$identity}' \
            >"${{ matrix.name }}.metadata.json"

      - name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.image }}
          subject-digest: ${{ steps.resolve.outputs.digest }}
          push-to-registry: true

      - name: Verify custom and GitHub-native provenance
        env:
          SUBJECT: ${{ steps.resolve.outputs.subject }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          cosign verify-attestation "${SUBJECT}" --type slsaprovenance1 \
            --certificate-identity="${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --output json >"${{ matrix.name }}.all-slsa-attestations.json"
          hack/verify-slsa-provenance.sh "${{ matrix.name }}.all-slsa-attestations.json" "${SUBJECT}" \
            "https://github.com/telekom/k8s-breakglass/.github/workflows/utility-dev-publish.yml" \
            "https://github.com/telekom/k8s-breakglass" "${SOURCE_SHA}" \
            "${WORKFLOW_IDENTITY}" true

      - name: Upload immutable reference and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utility-dev-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.ref
            ${{ matrix.name }}.metadata.json
            ${{ matrix.name }}.spdx.json
            ${{ matrix.name }}.provenance.json
            ${{ matrix.name }}.slsa-attestation.json
            ${{ matrix.name }}.all-slsa-attestations.json
          if-no-files-found: error

  utility-reference:
    name: Publish development reference manifest
    needs: utility-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download utility references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: utility-dev-*
          merge-multiple: true
          path: utility-dev

      - name: Validate and publish reference manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -Eeuo pipefail
          refs=(utility-dev/*.ref)
          [[ "${#refs[@]}" -eq 6 ]] || { echo "expected six utility references" >&2; exit 1; }
          collected_names=()
          for ref in "${refs[@]}"; do
            IFS='|' read -r name image digest remainder <"${ref}"
            [[ -z "${remainder:-}" ]] || { echo "malformed reference ${ref}" >&2; exit 1; }
            [[ "${name}" =~ ^(workload-debug|network-debug|storage-debug|dump-reader|node-maintenance|cluster-validator)$ ]] || exit 1
            [[ "${image}" == "ghcr.io/telekom/k8s-breakglass/${name}" ]] || exit 1
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            collected_names+=("${name}")
            metadata="utility-dev/${name}.metadata.json"
            jq -e --arg name "${name}" --arg image "${image}" --arg digest "${digest}" \
              --arg source "${SOURCE_SHA}" --arg workflow "${WORKFLOW_REF}" \
              '.name == $name and .image == $image and .digest == $digest and .sourceSha == $source and .workflowRef == $workflow' \
              "${metadata}" >/dev/null
          done
          actual_names="$(printf '%s\n' "${collected_names[@]}" | sort -u | paste -sd, -)"
          expected_names="cluster-validator,dump-reader,network-debug,node-maintenance,storage-debug,workload-debug"
          [[ "${actual_names}" == "${expected_names}" ]] || {
            echo "utility reference set mismatch: ${actual_names}" >&2
            exit 1
          }
          jq -s --arg source "${SOURCE_SHA}" --arg workflow "${WORKFLOW_REF}" \
            --arg identity "https://github.com/${WORKFLOW_REF}" \
            '{sourceSha:$source,workflowRef:$workflow,workflowIdentity:$identity,images:sort_by(.name)}' \
            utility-dev/*.metadata.json >utility-dev/references.json
          canonical_names='["cluster-validator","dump-reader","network-debug","node-maintenance","storage-debug","workload-debug"]'
          jq -e --arg source "${SOURCE_SHA}" --arg workflow "${WORKFLOW_REF}" \
            --arg identity "https://github.com/${WORKFLOW_REF}" \
            --argjson canonical_names "${canonical_names}" \
            '.sourceSha == $source and .workflowRef == $workflow and .workflowIdentity == $identity and (([.images[].name] | sort) == $canonical_names) and (([.images[].name] | unique | length) == ($canonical_names | length)) and all(.images[]; (.digest | test("^sha256:[0-9a-f]{64}$")))' \
            utility-dev/references.json >/dev/null

      - name: Upload immutable development reference manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utility-dev-references-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: utility-dev/references.json
          if-no-files-found: error
