name: Catalogue utility behavior

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "charts/debug-session-catalogue/**"
      - "cmd/cluster-validator/**"
      - "pkg/clustervalidator/**"
      - "hack/cluster-validator-**"
      - "Dockerfile.validator"
      - "utils/cluster-validator/**"
      - "utils/**"
      - ".github/workflows/catalogue-utility-integration.yml"
  push:
    branches: [main, deployment-testing]
    paths:
      - "charts/debug-session-catalogue/**"
      - "cmd/cluster-validator/**"
      - "pkg/clustervalidator/**"
      - "hack/cluster-validator-**"
      - "Dockerfile.validator"
      - "utils/cluster-validator/**"
      - "utils/**"
      - ".github/workflows/catalogue-utility-integration.yml"

permissions:
  contents: read

env:
  KIND_VERSION: v0.32.0
  KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd

jobs:
  network-diagnostics:
    name: Intent / network-diagnostics behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prove multi-architecture build
        run: make -C utils/network-debug build-multiarch OCI_ARCHIVE="${RUNNER_TEMP}/network-debug.oci.tar"
      - name: Install checksum-verified kind
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" --output kind.sha256sum
          sed 's#kind-linux-amd64#kind#' kind.sha256sum | sha256sum --check --status
          install -m 0755 kind "${RUNNER_TEMP}/kind"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build native image and disposable fio fixture
        env:
          NETWORK_DEBUG_IMAGE: network-debug:integration
          NETWORK_DEBUG_KUBESTR_FIXTURE_IMAGE: network-debug-kubestr-fio:integration
        run: |
          docker build --file utils/network-debug/Dockerfile --tag "${NETWORK_DEBUG_IMAGE}" utils/network-debug
          docker build --file utils/network-debug/tests/fixtures/kubestr-fio/Dockerfile --tag "${NETWORK_DEBUG_KUBESTR_FIXTURE_IMAGE}" utils/network-debug/tests/fixtures/kubestr-fio
      - name: Create disposable storage fixture
        env:
          NETWORK_DEBUG_KUBESTR_FIXTURE_IMAGE: network-debug-kubestr-fio:integration
        run: |
          kind create cluster --name network-debug-proof --image "${KIND_NODE_IMAGE}" --wait 120s
          kind load docker-image --name network-debug-proof "${NETWORK_DEBUG_KUBESTR_FIXTURE_IMAGE}"
          kind get kubeconfig --name network-debug-proof > "${RUNNER_TEMP}/network-debug.kubeconfig"
      - name: Execute every network tool contract
        env:
          KUBECONFIG: ${{ runner.temp }}/network-debug.kubeconfig
          NETWORK_DEBUG_IMAGE: network-debug:integration
          NETWORK_DEBUG_KUBESTR_FIXTURE_IMAGE: network-debug-kubestr-fio:integration
        run: make -C utils/network-debug integration
      - name: Remove and verify disposable cluster
        if: always()
        run: |
          set +e
          kind delete cluster --name network-debug-proof
          if kind get clusters | grep -Fxq network-debug-proof; then
            echo "network-debug-proof survived cleanup" >&2
            exit 1
          fi

  node-recovery:
    name: Intent / node-recovery and network-repair behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prove multi-architecture build
        run: make -C utils/node-maintenance build-multiarch OCI_ARCHIVE="${RUNNER_TEMP}/node-maintenance.oci.tar"
      - name: Execute recovery, repair, boundary, evidence, and cleanup contracts
        run: make -C utils/node-maintenance integration

  workload-diagnostics:
    name: Intent / workload-diagnostics behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prove multi-architecture build
        run: make -C utils/workload-debug build-multiarch OCI_ARCHIVE="${RUNNER_TEMP}/workload-debug.oci.tar"
      - name: Install checksum-verified kind
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" --output kind.sha256sum
          sed 's#kind-linux-amd64#kind#' kind.sha256sum | sha256sum --check --status
          install -m 0755 kind "${RUNNER_TEMP}/kind"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Execute DNS, TLS, HTTP, API, security, and cleanup contracts
        env:
          KIND_NODE_IMAGE: ${{ env.KIND_NODE_IMAGE }}
        run: make -C utils/workload-debug integration-test

  storage-and-dump-access:
    name: Intent / storage-diagnostics and dump-access behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prove multi-architecture builds
        run: make -C utils/images multiarch
      - name: Execute fio, ioping, dump, boundary, and cleanup contracts
        run: make -C utils/images integration

  cluster-validation:
    name: Intent / cluster-validation behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prove multi-architecture build
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=true --sbom=true --file utils/cluster-validator/Dockerfile \
            --output "type=oci,dest=${RUNNER_TEMP}/cluster-validator.oci.tar" .
      - name: Install checksum-verified kind
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" --output kind.sha256sum
          sed 's#kind-linux-amd64#kind#' kind.sha256sum | sha256sum --check --status
          install -m 0755 kind "${RUNNER_TEMP}/kind"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Execute readiness, RBAC, extension, secrecy, and cleanup contracts
        env:
          KIND_NODE_IMAGE: ${{ env.KIND_NODE_IMAGE }}
        run: make test-validator-integration
