name: Public reference usage

# Source lane: every PR and push to main (picked up by ci-gate's
# all-checks-green and listed in hack/release-required-checks.json).
# Published lane: after the Release workflow succeeds for a tag, weekly, and on
# demand; it runs against the immutable published chart digest and released image.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Reference artifact mode
        required: true
        default: published
        type: choice
        options: [source, published]
      elevated:
        description: Reserved; elevated catalogue profiles are disabled until trusted approval wiring exists
        required: true
        default: false
        type: boolean
      catalogue_version:
        description: Public debug-session-catalogue chart version
        required: true
        default: '0.2.0'
        type: string
      catalogue_digest:
        description: "Required in published mode: immutable OCI digest for the signed debug-session-catalogue chart"
        required: false
        default: ''
        type: string

permissions:
  contents: read
  attestations: read

env:
  KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reference:
    name: Reference usage (${{ (github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'published' || 'source') }})
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'published' || 'source') }}
      EVIDENCE_DIR: ${{ github.workspace }}/reference-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/kind-inotify-limits
      - name: Install kind
        uses: ./.github/actions/install-kind
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Install reference tools
        run: |
          make kustomize
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.2
      - name: Resolve released tag and immutable catalogue chart digest
        id: resolve
        if: ${{ env.MODE == 'published' && github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${RUN_TAG:-$(gh release list -R "${GITHUB_REPOSITORY}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')}"
          [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a release tag: ${tag}"; exit 1; }
          # Chart versions are independent of the app version: read it at the tag,
          # then require the published chart's appVersion to match the tag.
          version="$(gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY}/contents/charts/debug-session-catalogue/Chart.yaml?ref=${tag}" | yq '.version')"
          chart="ghcr.io/${GITHUB_REPOSITORY}/charts/debug-session-catalogue"
          digest="$(docker buildx imagetools inspect "${chart}:${version}" | awk '/^Digest:[[:space:]]+sha256:[0-9a-f]{64}$/ {print $2; exit}')"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::no digest for ${chart}:${version}"; exit 1; }
          app="$(helm show chart "oci://${chart}@${digest}" | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')"
          [[ "${app}" == "${tag}" || "${app}" == "${tag#v}" ]] || { echo "::error::chart ${version} appVersion ${app} does not match ${tag}"; exit 1; }
          {
            echo "tag=${tag}"
            echo "catalogue_version=${version}"
            echo "catalogue_digest=${digest}"
          } >> "${GITHUB_OUTPUT}"
      - name: Run source reference flow
        if: ${{ env.MODE == 'source' }}
        env:
          REFERENCE_MODE: source
          REFERENCE_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          REFERENCE_RUN_ELEVATED: ${{ github.event_name == 'workflow_dispatch' && inputs.elevated || 'false' }}
          REFERENCE_SETUP_SCRIPT: e2e/kind-setup-single.sh
          SKIP_PROXY: "true"
          KIND_RETAIN_ON_FAILURE: "true"
          REFERENCE_ENV_FILE: e2e/kind-setup-single-tdir/e2e-env.sh
          REFERENCE_TOKEN_HELPER: e2e/get-token.sh
          REFERENCE_REQUESTER_USERNAME: complete-flow-requester
          REFERENCE_REQUESTER_PASSWORD: complete-flow-requester-password
          REFERENCE_REQUESTER_EMAIL: complete-flow-requester@example.com
          REFERENCE_APPROVER_USERNAME: complete-flow-approver
          REFERENCE_APPROVER_PASSWORD: complete-flow-approver-password
          REFERENCE_APPROVER_EMAIL: complete-flow-approver@example.com
          REFERENCE_REQUESTER_GROUP: complete-flow-requester-base
          REFERENCE_AUDIT_WEBHOOK_URL: http://breakglass-audit-webhook-receiver.breakglass-system.svc.cluster.local:80/audit
          CATALOGUE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.catalogue_version || '0.2.0' }}
          KIND_NODE_IMAGE: ${{ env.KIND_NODE_IMAGE }}
        run: ./examples/reference-usage/reference-usage.sh
      - name: Run published reference flow
        if: ${{ env.MODE == 'published' }}
        env:
          REFERENCE_MODE: published
          REFERENCE_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          REFERENCE_RUN_ELEVATED: ${{ github.event_name == 'workflow_dispatch' && inputs.elevated || 'false' }}
          REFERENCE_SETUP_SCRIPT: e2e/kind-setup-single.sh
          SKIP_PROXY: "true"
          KIND_RETAIN_ON_FAILURE: "true"
          REFERENCE_ENV_FILE: e2e/kind-setup-single-tdir/e2e-env.sh
          REFERENCE_TOKEN_HELPER: e2e/get-token.sh
          REFERENCE_REQUESTER_USERNAME: complete-flow-requester
          REFERENCE_REQUESTER_PASSWORD: complete-flow-requester-password
          REFERENCE_REQUESTER_EMAIL: complete-flow-requester@example.com
          REFERENCE_APPROVER_USERNAME: complete-flow-approver
          REFERENCE_APPROVER_PASSWORD: complete-flow-approver-password
          REFERENCE_APPROVER_EMAIL: complete-flow-approver@example.com
          REFERENCE_REQUESTER_GROUP: complete-flow-requester-base
          REFERENCE_AUDIT_WEBHOOK_URL: http://breakglass-audit-webhook-receiver.breakglass-system.svc.cluster.local:80/audit
          CATALOGUE_VERSION: ${{ steps.resolve.outputs.catalogue_version || inputs.catalogue_version }}
          CATALOGUE_CHART_DIGEST: ${{ steps.resolve.outputs.catalogue_digest || inputs.catalogue_digest }}
          BREAKGLASS_VERSION: ${{ steps.resolve.outputs.tag }}
          KIND_NODE_IMAGE: ${{ env.KIND_NODE_IMAGE }}
        run: ./examples/reference-usage/reference-usage.sh
      - name: Collect cluster diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          {
            kubectl --context kind-breakglass-reference get pods -A -o wide
            kubectl --context kind-breakglass-reference -n breakglass-system describe pods
            kubectl --context kind-breakglass-reference -n breakglass-system logs --all-containers --tail=200 -l app.kubernetes.io/name=breakglass --prefix
            kubectl --context kind-breakglass-reference -n breakglass-system get events --sort-by=.lastTimestamp
          } > "${EVIDENCE_DIR}/cluster-diagnostics.txt" 2>&1 || true
      - name: Require no skipped or failed rows
        if: ${{ always() && env.MODE == 'published' }}
        run: |
          set -euo pipefail
          jq -e '(.rows | length) > 0 and all(.rows[]; .status == "pass") and (.image_digest_ref | length) > 0 and (.catalogue_digest | length) > 0' \
            "${EVIDENCE_DIR}/reference-usage.json" || { echo "::error::published lane has skipped/failed rows or missing digests"; cat "${EVIDENCE_DIR}/reference-usage.json" || true; exit 1; }
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-usage-${{ env.MODE }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
