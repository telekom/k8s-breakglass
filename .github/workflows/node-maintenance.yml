name: Node maintenance image

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "utils/node-maintenance/**"
      - "hack/docker-image-ownership.sh"
      - "hack/docker-resource-ownership.sh"
      - "hack/kind-ownership.sh"
      - "hack/kubernetes-delete-uid.sh"
      - "docs/node-maintenance.md"
      - ".github/workflows/node-maintenance.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    name: Node maintenance static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise image helper contracts
        run: make -C utils/node-maintenance test
      - uses: ./.github/actions/setup-shellcheck
      - name: ShellCheck image helpers
        run: shellcheck utils/node-maintenance/bin/* utils/node-maintenance/lib/*.sh utils/node-maintenance/tests/*.sh
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: utils/node-maintenance/Dockerfile

  behavior:
    name: Node maintenance real behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load the VRF kernel module for the exact VRF fixtures
        run: sudo modprobe vrf || { sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vrf; }
      - name: Exercise recovery, repair, boundary, evidence, and cleanup contracts
        run: make -C utils/node-maintenance integration
      - name: Install kind
        uses: ./.github/actions/install-kind
      - name: Build image for disposable host-network proof
        run: docker build --pull=false --file utils/node-maintenance/Dockerfile --tag node-maintenance-host-network:ci utils/node-maintenance
      - name: Exercise the hotfix executor in the real image
        env:
          NODE_MAINTENANCE_TEST_IMAGE: node-maintenance-host-network:ci
        run: make -C utils/node-maintenance hotfix-image
      - name: Exercise exact-node host-network recovery and repair
        env:
          NODE_MAINTENANCE_TEST_IMAGE: node-maintenance-host-network:ci
          NODE_MAINTENANCE_KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        run: make -C utils/node-maintenance kind-host-network
