name: Node maintenance image

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "utils/node-maintenance/**"
      - "docs/node-maintenance.md"
      - ".github/workflows/node-maintenance.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Node maintenance static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise image helper contracts
        run: make -C utils/node-maintenance test
      - name: ShellCheck image helpers
        run: shellcheck utils/node-maintenance/bin/* utils/node-maintenance/lib/*.sh utils/node-maintenance/tests/*.sh
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: utils/node-maintenance/Dockerfile

  behavior:
    name: Node maintenance real behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Exercise recovery, repair, boundary, evidence, and cleanup contracts
        run: make -C utils/node-maintenance integration
      - name: Install checksum-verified Kind
        env:
          KIND_VERSION: v0.32.0
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output ./kind
          printf '%s  ./kind\n' "${KIND_SHA256}" | sha256sum --check --status -
          chmod 0755 ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Build image for disposable host-network proof
        run: docker build --pull=false --file utils/node-maintenance/Dockerfile --tag node-maintenance-host-network:ci utils/node-maintenance
      - name: Exercise exact-node host-network recovery and repair
        env:
          NODE_MAINTENANCE_TEST_IMAGE: node-maintenance-host-network:ci
          NODE_MAINTENANCE_KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        run: make -C utils/node-maintenance kind-host-network
