name: Network-debug image behavior

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "utils/network-debug/**"
      - "hack/docker-resource-ownership.sh"
      - "hack/kind-ownership.sh"
      - "hack/kubernetes-delete-uid.sh"
      - "docs/network-debug-image.md"
      - "CHANGELOG.md"
      - ".github/workflows/network-debug-pod-capture-integration.yml"
  push:
    # Run on every main commit so release tags always have an exact, fresh
    # behavior result for this utility in the release gate. Pull requests
    # remain path-filtered below to avoid unrelated PR work.
    branches: [main]

permissions:
  contents: read

env:
  KIND_VERSION: v0.32.0
  KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
  KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  NETWORK_DEBUG_IMAGE: network-debug:pod-capture-integration

jobs:
  static:
    name: Network-debug static behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run image helper behavior
        run: make -C utils/network-debug test
      - name: ShellCheck image helpers
        run: shellcheck utils/network-debug/scripts/* utils/network-debug/tests/*.sh
      - name: Lint image Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: utils/network-debug/Dockerfile

  host-network-capture-and-trace:
    name: Network-debug host capture and trace behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified kind
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          printf '%s  kind\n' "${KIND_SHA256}" | sha256sum --check --status -
          install -m 0755 kind "${RUNNER_TEMP}/kind"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build image
        run: docker build --file utils/network-debug/Dockerfile --tag network-debug:integration utils/network-debug
      - name: Prove bounded host tcpdump, pwru, security, and cleanup
        env:
          NETWORK_DEBUG_IMAGE: network-debug:integration
        run: make -C utils/network-debug integration

  selected-pod-capture:
    name: Network-debug selected-pod capture behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified kind
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          printf '%s  kind\n' "${KIND_SHA256}" | sha256sum --check --status -
          install -m 0755 kind "${RUNNER_TEMP}/kind"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Build image with ephemeral capture support
        run: docker build --file utils/network-debug/Dockerfile --tag "${NETWORK_DEBUG_IMAGE}" utils/network-debug
      - name: Prove target-versus-decoy capture and exact cleanup
        run: make -C utils/network-debug pod-capture-integration
