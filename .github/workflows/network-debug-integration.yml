---

name: Network Debug Integration

"on":
  pull_request:
    branches: [main, deployment-testing]
    paths:
      - 'utils/network-debug/**'
      - 'docs/network-debug-image.md'
      - '.github/workflows/network-debug-integration.yml'
  push:
    branches: [main, deployment-testing]
    paths:
      - 'utils/network-debug/**'
      - 'docs/network-debug-image.md'
      - '.github/workflows/network-debug-integration.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  KIND_VERSION: v0.32.0
  KIND_NODE_IMAGE: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  NETWORK_DEBUG_IMAGE: network-debug:integration
  KUBESTR_FIXTURE_IMAGE: network-debug-kubestr-fio:integration

jobs:
  integration-linux-bpf-kind:
    name: "Required compatible Linux BPF runner: real tool and kubestr proofs"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install and verify kind
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" --output kind.sha256sum
          grep 'kind-linux-amd64' kind.sha256sum | sha256sum --check --status
          chmod 0755 kind
          mkdir -p "${RUNNER_TEMP}/network-debug-bin"
          mv kind "${RUNNER_TEMP}/network-debug-bin/kind"
          echo "${RUNNER_TEMP}/network-debug-bin" >> "${GITHUB_PATH}"
          kind version
          kubectl version --client

      - name: Build network-debug image
        run: docker build --file utils/network-debug/Dockerfile --tag "${NETWORK_DEBUG_IMAGE}" utils/network-debug

      - name: Build disposable kubestr fio fixture
        run: docker build --file utils/network-debug/tests/fixtures/kubestr-fio/Dockerfile --tag "${KUBESTR_FIXTURE_IMAGE}" utils/network-debug/tests/fixtures/kubestr-fio

      - name: Create disposable kind cluster
        run: kind create cluster --name network-debug-proof --image "${KIND_NODE_IMAGE}" --wait 120s

      - name: Load disposable fio fixture into kind
        run: kind load docker-image --name network-debug-proof "${KUBESTR_FIXTURE_IMAGE}"

      - name: Run fail-closed integration contract
        env:
          KUBECONFIG: ${{ github.workspace }}/kind-kubeconfig
        run: |
          set -euo pipefail
          kind get kubeconfig --name network-debug-proof > "${KUBECONFIG}"
          make -C utils/network-debug integration

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,pvc,storageclass --all-namespaces -o wide || true
          kind export logs --name network-debug-proof ./kind-logs || true

      - name: Delete disposable kind cluster
        if: always()
        run: kind delete cluster --name network-debug-proof || true
