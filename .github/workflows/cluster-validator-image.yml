name: Cluster-validator checks

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - Dockerfile.validator
      - cmd/cluster-validator/**
      - pkg/clustervalidator/**
      - docs/cluster-validator.md
      - docs/runbooks/cluster-validator.md
      - motd/cluster-validator.motd
      - hack/cluster-validator-integration.sh
      - hack/cluster-validator-integration.contract.json
      - hack/cluster-validator-extension/**
      - .github/workflows/cluster-validator-image.yml
  pull_request:
    paths:
      - Dockerfile.validator
      - cmd/cluster-validator/**
      - pkg/clustervalidator/**
      - Makefile
      - go.mod
      - go.sum
      - docs/cluster-validator.md
      - docs/runbooks/cluster-validator.md
      - motd/cluster-validator.motd
      - hack/cluster-validator-integration.sh
      - hack/cluster-validator-integration.contract.json
      - hack/cluster-validator-extension/**
      - .github/workflows/cluster-validator-image.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test validator
        run: make test-validator
