name: Breakglass hard expiry

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "LICENSE"
      - "LICENSES/**"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "e2e/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "pkg/**"
      - "utils/config/**"
      - "versions.env"
      - ".github/scripts/ci-e2e-diagnostics.sh"
      - ".github/scripts/test-ci-e2e-diagnostics.sh"
      - ".github/workflows/hard-expiry.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  KIND_VERSION: v0.32.0
  BUSYBOX_IMAGE: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  # cacheAuthorizedRequests is available in the structured authorization
  # configuration from Kubernetes 1.34. This lane exercises that supported
  # boundary; the regular full suite remains on its current 1.36 image.
  KIND_NODE_IMAGE: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  hard-expiry:
    name: Hard expiry behavior (Kubernetes 1.34)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kind
        run: |
          set -Eeuo pipefail
          kind_sha256=50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" \
            --output ./kind
          echo "${kind_sha256}  ./kind" | sha256sum --check --status
          chmod 0755 ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Build controller image
        run: docker build --tag breakglass:hard-expiry .

      - name: Set up Kubernetes 1.34 hub and spokes
        run: |
          set -Eeuo pipefail
          chmod +x e2e/kind-setup-multi.sh
          PRESERVE_ON_FAILURE=true \
            KIND_RETAIN_ON_FAILURE=true \
            SKIP_PROXY=true \
            IMAGE=breakglass:hard-expiry \
            BUSYBOX_IMAGE="${BUSYBOX_IMAGE}" \
            UI_FLAVOUR=telekom \
            KIND_NODE_IMAGE="${KIND_NODE_IMAGE}" \
            ./e2e/kind-setup-multi.sh 2>&1 | tee hard-expiry-setup.log
          test -s e2e/kind-setup-multi-tdir/env.sh

      - name: Export isolated OIDC test environment
        run: |
          set -Eeuo pipefail
          source e2e/kind-setup-multi-tdir/env.sh
          for name in \
            E2E_HUB_KUBECONFIG E2E_SPOKE_A_KUBECONFIG E2E_SPOKE_B_KUBECONFIG \
            E2E_SPOKE_A_OIDC_KUBECONFIG E2E_SPOKE_B_OIDC_KUBECONFIG \
            E2E_HUB_EXTERNAL_IP E2E_HUB_WEBHOOK_URL KEYCLOAK_CA_FILE \
            KEYCLOAK_INTERNAL_URL TLS_DIR; do
            value="${!name:-}"
            test -n "$value"
            case "$name" in
              *_KUBECONFIG|KEYCLOAK_CA_FILE|TLS_DIR) value="$(realpath "$value")" ;;
            esac
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          {
            echo "E2E_TEST=true"
            echo "E2E_MULTI_CLUSTER=true"
            echo "E2E_HARD_EXPIRY=true"
            echo "E2E_NAMESPACE=breakglass-system"
            echo "E2E_CLUSTER_NAME=spoke-cluster-a"
            echo "KEYCLOAK_HOST=https://localhost:8443"
            echo "KEYCLOAK_REALM=breakglass-e2e"
            echo "KEYCLOAK_CLIENT_ID=breakglass-ui"
            echo "KEYCLOAK_ISSUER_HOST=e2e-keycloak:8443"
          } >> "$GITHUB_ENV"

      - name: Forward hub API
        run: |
          set -Eeuo pipefail
          for api_port in $(shuf -i 18080-18180 -n 20); do
            if ! (echo >"/dev/tcp/127.0.0.1/${api_port}") 2>/dev/null; then
              break
            fi
          done
          test -n "${api_port:-}"
          # The focused expiry proof deliberately rolls the controller
          # Deployment while pausing cleanup. A one-shot port-forward exits
          # when that rollout replaces the selected Pod, making later tests
          # fail with EOF even though the service is healthy. Keep the
          # forwarding endpoint alive across expected Pod restarts, just like
          # the normal E2E CI lanes do.
          (
            set +e
            pf_pid=""
            trap 'kill "$pf_pid" 2>/dev/null; exit 0' EXIT TERM INT
            while true; do
              kubectl --kubeconfig "$E2E_HUB_KUBECONFIG" \
                -n breakglass-system port-forward svc/breakglass-breakglass "${api_port}:8080" &
              pf_pid=$!
              wait "$pf_pid"
              echo "[keepalive] API port-forward exited, restarting in 2s..."
              sleep 2
            done
          ) > hard-expiry-api-port-forward.log 2>&1 &
          echo "HARD_EXPIRY_API_FORWARD_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${api_port}/healthz" >/dev/null; then
              echo "E2E_HUB_API_URL=http://127.0.0.1:${api_port}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat hard-expiry-api-port-forward.log
          exit 1

      - name: Run focused unit boundary tests
        run: |
          set -Eeuo pipefail
          bash .github/scripts/test-ci-e2e-diagnostics.sh
          make GO_TEST_COUNT=1 test-hard-expiry-unit

      - name: Run focused Kubernetes 1.34 hard-expiry behavior
        run: |
          set -Eeuo pipefail
          make test-hard-expiry-e2e 2>&1 | tee hard-expiry-results.log

      - name: Collect hard-expiry diagnostics
        if: failure()
        run: |
          set +e
          source .github/scripts/ci-e2e-diagnostics.sh
          ci_mask_secret_like_e2e_env
          mkdir -p hard-expiry-diagnostics
          for source in hard-expiry-setup.log hard-expiry-results.log hard-expiry-api-port-forward.log; do
            if [ -f "$source" ]; then
              ci_write_bounded_redacted_file "hard-expiry-diagnostics/$source" 2000 1048576 < "$source"
            fi
          done
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' \
            | ci_write_bounded_redacted_file hard-expiry-diagnostics/docker-ps.txt 200 131072
          for cluster_entry in \
            "breakglass-hub:$E2E_HUB_KUBECONFIG" \
            "spoke-cluster-a:$E2E_SPOKE_A_KUBECONFIG" \
            "spoke-cluster-b:$E2E_SPOKE_B_KUBECONFIG"; do
            cluster="${cluster_entry%%:*}"
            kubeconfig="${cluster_entry#*:}"
            cluster_dir="hard-expiry-diagnostics/$cluster"
            mkdir -p "$cluster_dir"
            kubectl --kubeconfig "$kubeconfig" get nodes,pods -A -o wide 2>&1 \
              | ci_write_bounded_redacted_file "$cluster_dir/objects.txt" 1000 524288
            kubectl --kubeconfig "$kubeconfig" get events -A --sort-by=.lastTimestamp 2>&1 \
              | ci_write_bounded_redacted_file "$cluster_dir/events.txt" 1000 524288
            for pod in $(kubectl --kubeconfig "$kubeconfig" -n breakglass-system get pods \
              -l app.kubernetes.io/name=breakglass -o name 2>/dev/null); do
              safe_pod="${pod#pod/}"
              kubectl --kubeconfig "$kubeconfig" -n breakglass-system logs "$pod" \
                --all-containers --timestamps --tail=2000 2>&1 \
                | ci_write_bounded_redacted_file "$cluster_dir/${safe_pod}.log" 2000 1048576
            done
          done
          docker logs --timestamps --tail 2000 e2e-keycloak 2>&1 \
            | ci_write_bounded_redacted_file hard-expiry-diagnostics/keycloak.log 2000 1048576

      - name: Upload hard-expiry diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hard-expiry-diagnostics
          path: hard-expiry-diagnostics
          if-no-files-found: warn
          retention-days: 1

      - name: Tear down hard-expiry clusters
        if: always()
        run: |
          set +e
          if [ -n "${HARD_EXPIRY_API_FORWARD_PID:-}" ]; then
            kill "$HARD_EXPIRY_API_FORWARD_PID" 2>/dev/null || true
          fi
          kind delete cluster --name breakglass-hub
          kind delete cluster --name spoke-cluster-a
          kind delete cluster --name spoke-cluster-b
          docker rm -f e2e-keycloak 2>/dev/null || true
