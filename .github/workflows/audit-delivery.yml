name: Audit delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-delivery-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  broker-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Verify shell
        run: shellcheck hack/audit-delivery-kind.sh
      - name: Real broker outage and recovery
        run: bash hack/audit-delivery-kind.sh
