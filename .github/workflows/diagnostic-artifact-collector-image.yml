name: Diagnostic artifact collector image

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "utils/images/diagnostic-artifact-collector/**"
      - ".github/workflows/diagnostic-artifact-collector-image.yml"
  push:
    branches: [main, deployment-testing]
    paths:
      - "utils/images/diagnostic-artifact-collector/**"
      - ".github/workflows/diagnostic-artifact-collector-image.yml"

permissions:
  contents: read

jobs:
  diagnostic-artifact-collection:
    name: Utility image checks (diagnostic-artifact-collection)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Run copier and uploader tests
        run: make -C utils/images/diagnostic-artifact-collector test
      - name: Lint image helper shell
        run: make -C utils/images/diagnostic-artifact-collector shellcheck
      - name: Lint image Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: utils/images/diagnostic-artifact-collector/Dockerfile
