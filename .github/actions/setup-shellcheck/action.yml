name: Set up ShellCheck
description: >-
  Install a pinned ShellCheck release so lint results do not change when the
  runner image updates its preinstalled copy (ubuntu-24.04 ships 0.9.0,
  ubuntu-26.04 ships 0.11.0).

runs:
  using: composite
  steps:
    - name: Install ShellCheck
      shell: bash
      env:
        SHELLCHECK_VERSION: v0.11.0
        SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/shellcheck"
        archive="$dir.tar.xz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        echo "${SHELLCHECK_SHA256}  $archive" | sha256sum -c -
        mkdir -p "$dir"
        tar -xJf "$archive" -C "$dir" --strip-components=1
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/shellcheck" --version
