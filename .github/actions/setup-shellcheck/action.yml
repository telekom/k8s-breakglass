name: Set up ShellCheck
description: >-
  Install a pinned ShellCheck release so lint results do not change when the
  runner image updates its preinstalled copy (ubuntu-24.04 ships 0.9.0,
  ubuntu-26.04 ships 0.11.0).

runs:
  using: composite
  steps:
    - name: Install ShellCheck
      shell: bash
      env:
        SHELLCHECK_VERSION: v0.11.0
        SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/shellcheck"
        archive="$dir.tar.xz"
        asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        # github.com/.../releases/download can 504 for long stretches while the
        # REST asset endpoint still serves; fall back to it via gh.
        if ! curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"; then
          echo "::warning::release download failed; retrying via the GitHub API"
          gh release download "$SHELLCHECK_VERSION" --repo koalaman/shellcheck \
            --pattern "$asset" --output "$archive" --clobber
        fi
        echo "${SHELLCHECK_SHA256}  $archive" | sha256sum -c -
        mkdir -p "$dir"
        tar -xJf "$archive" -C "$dir" --strip-components=1
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/shellcheck" --version
