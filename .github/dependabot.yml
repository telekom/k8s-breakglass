version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    allow:
      - dependency-type: "all"
    ignore:
      # v0.32+ declares cel.dev/cel-go, not the legacy path used by Kubernetes.
      - dependency-name: "github.com/google/cel-go"
        versions: [">= 0.32.0"]
    cooldown:
      default-days: 3
      semver-major-days: 14
    schedule:
      interval: "daily"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-major:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types:
          - "major"
      go-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(go)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    cooldown:
      default-days: 3
      semver-major-days: 14
    schedule:
      interval: "daily"
    groups:
      vue-ecosystem:
        patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
      npm-major:
        patterns:
          - "*"
        exclude-patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(npm)"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
    groups:
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5

  # Makefile and CI Go tools. Each hack/tools/<tool> directory is a separate
  # module so every tool keeps exactly its own upstream dependency graph.
  # Only the tools themselves (recorded as indirect requirements by the `tool`
  # directive) are updated; indirect modules follow each tool's own releases.
  # `allow` applies to every directory, so golang.org/x/tools is deliberately
  # absent: listing it would also move controller-gen, govulncheck and
  # go-licenses off their upstream graphs. gosec's x/tools floor (ahead of its
  # own requirement, for the current Go export-data format) is raised manually.
  - package-ecosystem: "gomod"
    directories:
      - /hack/tools/*
    allow:
      - dependency-name: "sigs.k8s.io/kustomize/kustomize/v5"
        dependency-type: "all"
      - dependency-name: "sigs.k8s.io/controller-tools"
        dependency-type: "all"
      - dependency-name: "sigs.k8s.io/controller-runtime/tools/setup-envtest"
        dependency-type: "all"
      - dependency-name: "golang.org/x/vuln"
        dependency-type: "all"
      - dependency-name: "github.com/securego/gosec/v2"
        dependency-type: "all"
      - dependency-name: "github.com/google/go-licenses/v2"
        dependency-type: "all"
      - dependency-name: "sigs.k8s.io/kind"
        dependency-type: "all"
      - dependency-name: "github.com/rhysd/actionlint"
        dependency-type: "all"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      go-tools:
        group-by: dependency-name
        patterns:
          - "*"
    commit-message:
      prefix: "deps(tools)"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    # Dockerfile discovery is not recursive. Include each independent build
    # context and the directories containing Kubernetes image references.
    directories:
      - /
      - /utils/cluster-validator
      - /utils/images/diagnostic-artifact-collector
      - /utils/images/dump-reader
      - /utils/images/storage-debug
      - /utils/network-debug
      - /utils/node-maintenance
      - /utils/workload-debug
      - /e2e/images/tmux-debug
      - /e2e/fixtures
      - /e2e/fixtures/templates
      - /config/dev/resources
      - /config/dev/resources/crs
      - /config/samples
    exclude-paths:
      # Compatibility symlink; update its canonical build context above.
      - Dockerfile.validator
    ignore:
      # Our own source-built images and zero-digest release placeholders are
      # resolved by the signed release pipeline, not external version updates.
      - dependency-name: "ghcr.io/telekom/k8s-breakglass*"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
    groups:
      docker-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "major"
      docker-minor-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Digest-only updates have no SemVer increase. Handle updates left over
      # after the version groups together across all configured directories.
      docker-digests:
        group-by: dependency-name
        patterns:
          - "*"
    commit-message:
      prefix: "deps(docker)"
    open-pull-requests-limit: 5

  - package-ecosystem: helm
    directories:
      - /charts/*
    ignore:
      - dependency-name: "ghcr.io/telekom/k8s-breakglass*"
    cooldown:
      default-days: 3
    schedule:
      interval: "daily"
    groups:
      helm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      helm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(helm)"
    open-pull-requests-limit: 5

# Dependabot does not update RUN apk/apt pins, arbitrary shell/versions.env
# assignments, tool checksums, or image metadata/OCI labels alongside FROM.
# See docs/building.md#dependency-updates for the coverage and maintenance map.
