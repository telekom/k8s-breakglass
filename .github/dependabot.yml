version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "daily"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-major:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types:
          - "major"
      go-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(go)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    groups:
      vue-ecosystem:
        patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
      npm-major:
        patterns:
          - "*"
        exclude-patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "major"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(npm)"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    # Dockerfile discovery is not recursive. Include each independent build
    # context and the directories containing Kubernetes image references.
    directories:
      - /
      - /utils/cluster-validator
      - /utils/images/diagnostic-artifact-collector
      - /utils/images/dump-reader
      - /utils/images/storage-debug
      - /utils/network-debug
      - /utils/node-maintenance
      - /utils/workload-debug
      - /e2e/images/tmux-debug
      - /e2e/fixtures/templates
      - /config/dev/resources
      - /config/dev/resources/crs
      - /config/samples
    exclude-paths:
      # Compatibility symlink; update its canonical build context above.
      - Dockerfile.validator
    ignore:
      # Our own source-built images and zero-digest release placeholders are
      # resolved by the signed release pipeline, not external version updates.
      - dependency-name: "ghcr.io/telekom/k8s-breakglass*"
    schedule:
      interval: "daily"
    groups:
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Digest-only updates have no SemVer increase. Handle updates left over
      # after the version groups together across all configured directories.
      docker-digests:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(docker)"
    open-pull-requests-limit: 5

  - package-ecosystem: helm
    directories:
      - /charts/*
    ignore:
      - dependency-name: "ghcr.io/telekom/k8s-breakglass*"
    schedule:
      interval: "daily"
    groups:
      helm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      helm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(helm)"
    open-pull-requests-limit: 5

# Dependabot does not update RUN apk/apt pins, arbitrary shell/versions.env
# assignments, tool checksums, or image metadata/OCI labels alongside FROM.
# See docs/building.md#dependency-updates for the coverage and maintenance map.
