        \  - {kind: ValidatingPolicy, name: disallow-host-namespaces}\n    - {kind: ValidatingPolicy, name: disallow-host-path}\n\
        \    - {kind: ValidatingPolicy, name: restrict-volume-types}\n    - {kind: ValidatingPolicy, name: ensure-readonly-hostpath}\n\
        \    - {kind: ValidatingPolicy, name: restrict-controlplane-scheduling}\n  matchConditions:\n    - name: approved-session\n\
        \      expression: {{ printf `request.operation in ['CREATE', 'UPDATE'] && request.namespace == %q && request.kind.kind\
        \ in ['Pod', 'Job'] && (request.kind.kind == 'Job' ? object.spec.template.metadata : object.metadata).annotations['breakglass.t-caas.telekom.com/source-session-uid']\
        \ == %q && (request.kind.kind == 'Job' ? object.spec.template.metadata : object.metadata).labels['breakglass.telekom.com/debug-session']\
        \ == %q && (request.kind.kind == 'Job' ? object.spec.template.metadata : object.metadata).labels['breakglass.telekom.com/debug-template']\
        \ == 'convergence-etcd-snapshot'` .target.namespace (required `session UID is required` .session.uid) .session.name | yamlQuote\
        \ }}\n    - name: controller-actor\n      expression: >-\n        request.kind.kind == 'Job'\n          ? (request.userInfo.username\
        \ == 'kubernetes-admin'\n              && request.userInfo.?groups.orValue([]).exists(g, g in ['system:masters', 'kubeadm:cluster-admins']))\n\
        \          : (request.userInfo.username in ['system:kube-controller-manager', 'system:serviceaccount:kube-system:job-controller']\n\
        \              && object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job' && o.apiVersion == 'batch/v1'\
        \ && o.controller == true && o.uid != ''))\n    - name: approved-control-plane-node\n      expression: {{ printf `(request.kind.kind\
        \ == 'Job' ? object.spec.template.spec : object.spec).?nodeSelector[?'kubernetes.io/hostname'].orValue('') == %q &&\
        \ (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).?nodeSelector[?'node-role.kubernetes.io/control-plane'].orValue('absent')\
        \ == '' && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).?nodeName.orValue('') in ['', %q]`\
        \ (required `approved targetNode is required` .vars.targetNode) .vars.targetNode | yamlQuote }}\n    - name: approved-client\n\
        \      expression: {{ printf `%q in ['/bin', '/bin/etcd-3.5']` (required `etcdClient is required` .vars.etcdClient)\
        \ | yamlQuote }}\n    - name: exact-etcd-argv\n      expression: {{ printf `(request.kind.kind == 'Job' ? object.spec.template.spec\
        \ : object.spec).initContainers[0].name == 'members' && (request.kind.kind == 'Job' ? object.spec.template.spec :\
        \ object.spec).initContainers[0].command == ['%[1]s/etcdctl', '--endpoints=https://127.0.0.1:2379', '--cacert=/etc/etcd-pki/ca.crt',\
        \ '--cert=/etc/etcd-pki/healthcheck-client.crt', '--key=/etc/etcd-pki/healthcheck-client.key', '--command-timeout=30s',\
        \ 'endpoint', 'status', '--cluster', '-w', 'table'] && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).initContainers[1].name\
        \ == 'health' && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).initContainers[1].command\
        \ == ['%[1]s/etcdctl', '--endpoints=https://127.0.0.1:2379', '--cacert=/etc/etcd-pki/ca.crt', '--cert=/etc/etcd-pki/healthcheck-client.crt',\
        \ '--key=/etc/etcd-pki/healthcheck-client.key', '--command-timeout=30s', 'endpoint', 'health', '--cluster', '-w',\
        \ 'table'] && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).initContainers[2].name == 'save'\
        \ && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).initContainers[2].command == ['%[1]s/etcdctl',\
        \ '--endpoints=https://127.0.0.1:2379', '--cacert=/etc/etcd-pki/ca.crt', '--cert=/etc/etcd-pki/healthcheck-client.crt',\
        \ '--key=/etc/etcd-pki/healthcheck-client.key', '--command-timeout=30s', 'snapshot', 'save', '/snapshots/%[2]s.db']\
        \ && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).containers[0].name == 'verify' && (request.kind.kind\
        \ == 'Job' ? object.spec.template.spec : object.spec).containers[0].command == ['%[1]s/etcdutl', 'snapshot', 'status',\
        \ '/snapshots/%[2]s.db', '-w', 'table']` (required `etcdClient is required` .vars.etcdClient) (required `session name\
        \ is required` .session.name) | yamlQuote }}\n    - name: exact-etcd-pod\n      expression: >-\n        (request.kind.kind\
        \ == 'Job' ? object.spec.template.spec : object.spec).hostNetwork == true\n        && !(request.kind.kind == 'Job'\
        \ ? object.spec.template.spec : object.spec).?hostPID.orValue(false)\n        && !(request.kind.kind == 'Job' ? object.spec.template.spec\
        \ : object.spec).?hostIPC.orValue(false)\n        && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).automountServiceAccountToken\
        \ == false\n        && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).restartPolicy == 'Never'\n\
        \        && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).?securityContext.?sysctls.orValue([]).size()\
        \ == 0\n        && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).?ephemeralContainers.orValue([]).size()\
        \ == 0\n        && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).tolerations.exists(t, t.?key.orValue('')\
        \ == 'node-role.kubernetes.io/control-plane' && t.?operator.orValue('') == 'Exists' && t.?effect.orValue('') == 'NoSchedule')\n\
        \        && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).tolerations.all(t, (t.?key.orValue('')\
        \ == 'node-role.kubernetes.io/control-plane' && t.?operator.orValue('') == 'Exists' && t.?effect.orValue('') == 'NoSchedule')\n\
