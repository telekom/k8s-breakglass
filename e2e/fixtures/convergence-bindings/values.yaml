- apiVersion: breakglass.t-caas.telekom.com/v1alpha1
  kind: DebugSessionTemplate
  metadata:
    name: convergence-etcd-snapshot
  spec:
    motd:
      message: E2E convergence diagnostics; use only the disposable test cluster.
    displayName: Emergency etcd snapshot
    description: 'Non-interactive, health-gated etcd snapshot on one approved control-plane node: etcdctl from the digest-pinned
      toolbox image checks that every member answers and is healthy, saves a snapshot of the local member to /var/lib/etcd-snapshots/<session>.db
      on that node, and prints its hash and revision in the Job logs.'
    mode: workload
    workloadType: Job
    targetNamespace: breakglass-debug
    failMode: closed
    extraDeployVariables:
    - name: targetNode
      displayName: Control-plane node
      description: Exact control-plane node whose local etcd member the Job uses. One member per session.
      inputType: text
      required: true
      validation:
        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
        maxLength: 253
    - name: etcdClient
      displayName: etcd client version
      description: etcdctl/etcdutl matching the cluster's etcd (3.6 for Kubernetes 1.34+, 3.5 for 1.31-1.33).
      inputType: select
      required: true
      default: /bin
      options:
      - value: /bin
        displayName: etcd 3.6
      - value: /bin/etcd-3.5
        displayName: etcd 3.5
    podTemplateString: "automountServiceAccountToken: false\nenableServiceLinks: false\nrestartPolicy: Never\nterminationGracePeriodSeconds:\
      \ 10\nactiveDeadlineSeconds: 600\nhostNetwork: true\nhostPID: false\nhostIPC: false\ndnsPolicy: ClusterFirstWithHostNet\n\
      imagePullSecrets:\n  - name: unused-e2e-pull-secret\nnodeSelector:\n  kubernetes.io/os: linux\n\
      \  node-role.kubernetes.io/control-plane: \"\"\n  kubernetes.io/hostname: {{ .vars.targetNode | yamlQuote }}\ntolerations:\n\
      \  - key: node-role.kubernetes.io/control-plane\n    operator: Exists\n    effect: NoSchedule\nsecurityContext:\n  runAsUser:\
      \ 0\n  runAsGroup: 0\n  runAsNonRoot: false\n  seccompProfile:\n    type: RuntimeDefault\ninitContainers:\n  - name:\
      \ members\n    image: \"nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"\
      \n    imagePullPolicy: \"IfNotPresent\"\n    command:\n      - {{ printf \"%s/etcdctl\" .vars.etcdClient | yamlQuote\
      \ }}\n      - --endpoints=https://127.0.0.1:2379\n      - --cacert=/etc/etcd-pki/ca.crt\n      - --cert=/etc/etcd-pki/healthcheck-client.crt\n\
      \      - --key=/etc/etcd-pki/healthcheck-client.key\n      - --command-timeout=30s\n      - endpoint\n      - status\n\
      \      - --cluster\n      - -w\n      - table\n    securityContext:\n      privileged: false\n      allowPrivilegeEscalation:\
      \ false\n      readOnlyRootFilesystem: true\n      capabilities:\n        drop: [\"ALL\"]\n    resources:\n      requests:\n\
      \        cpu: \"50m\"\n        memory: \"64Mi\"\n      limits:\n        memory: \"256Mi\"\n    volumeMounts:\n     \
      \ - name: etcd-pki\n        mountPath: /etc/etcd-pki\n        readOnly: true\n  - name: health\n    image: \"nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"\
      \n    imagePullPolicy: \"IfNotPresent\"\n    command:\n      - {{ printf \"%s/etcdctl\" .vars.etcdClient | yamlQuote\
      \ }}\n      - --endpoints=https://127.0.0.1:2379\n      - --cacert=/etc/etcd-pki/ca.crt\n      - --cert=/etc/etcd-pki/healthcheck-client.crt\n\
      \      - --key=/etc/etcd-pki/healthcheck-client.key\n      - --command-timeout=30s\n      - endpoint\n      - health\n\
      \      - --cluster\n      - -w\n      - table\n    securityContext:\n      privileged: false\n      allowPrivilegeEscalation:\
      \ false\n      readOnlyRootFilesystem: true\n      capabilities:\n        drop: [\"ALL\"]\n    resources:\n      requests:\n\
      \        cpu: \"50m\"\n        memory: \"64Mi\"\n      limits:\n        memory: \"256Mi\"\n    volumeMounts:\n     \
      \ - name: etcd-pki\n        mountPath: /etc/etcd-pki\n        readOnly: true\n  - name: save\n    image: \"nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"\
      \n    imagePullPolicy: \"IfNotPresent\"\n    command:\n      - {{ printf \"%s/etcdctl\" .vars.etcdClient | yamlQuote\
      \ }}\n      - --endpoints=https://127.0.0.1:2379\n      - --cacert=/etc/etcd-pki/ca.crt\n      - --cert=/etc/etcd-pki/healthcheck-client.crt\n\
      \      - --key=/etc/etcd-pki/healthcheck-client.key\n      - --command-timeout=30s\n      - snapshot\n      - save\n\
      \      - {{ printf \"/snapshots/%s.db\" .session.name | yamlQuote }}\n    securityContext:\n      privileged: false\n\
      \      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities:\n        drop: [\"ALL\"\
      ]\n    resources:\n      requests:\n        cpu: \"50m\"\n        memory: \"64Mi\"\n      limits:\n        memory: \"\
      256Mi\"\n    volumeMounts:\n      - name: etcd-pki\n        mountPath: /etc/etcd-pki\n        readOnly: true\n     \
      \ - name: snapshots\n        mountPath: /snapshots\ncontainers:\n  - name: verify\n    image: \"nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"\
      \n    imagePullPolicy: \"IfNotPresent\"\n    command:\n      - {{ printf \"%s/etcdutl\" .vars.etcdClient | yamlQuote\
      \ }}\n      - snapshot\n      - status\n      - {{ printf \"/snapshots/%s.db\" .session.name | yamlQuote }}\n      -\
      \ -w\n      - table\n    securityContext:\n      privileged: false\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem:\
      \ true\n      capabilities:\n        drop: [\"ALL\"]\n    resources:\n      requests:\n        cpu: \"50m\"\n      \
      \  memory: \"64Mi\"\n      limits:\n        memory: \"256Mi\"\n    volumeMounts:\n      - name: etcd-pki\n        mountPath:\
      \ /etc/etcd-pki\n        readOnly: true\n      - name: snapshots\n        mountPath: /snapshots\nvolumes:\n  - name:\
      \ etcd-pki\n    hostPath:\n      path: /etc/kubernetes/pki/etcd\n      type: Directory\n  - name: snapshots\n    hostPath:\n\
      \      path: /var/lib/etcd-snapshots\n      type: DirectoryOrCreate\n"
    requiredAuxiliaryResourceCategories:
    - policy-exceptions
    auxiliaryResources:
    - name: etcd-recipe-policy-exception
      category: policy-exceptions
      description: Permit only this approved session's fixed etcdctl Job on the approved control-plane node.
      createBefore: true
      deleteAfter: true
