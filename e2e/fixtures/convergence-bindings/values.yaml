        \ == 1\n          && (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec).volumes.filter(v, v.name\
        \ == 'breakglass-motd').all(v,\n               has(v.downwardAPI) && !has(v.hostPath) && !has(v.emptyDir) && !has(v.configMap)\
