        \ && !has(c.resizePolicy)\n             && c.?env.orValue([]).filter(e, !(e.name in ['BREAKGLASS_MOTD', 'BREAKGLASS_RUNBOOK_URL',\
        \ 'ENV', 'PROMPT_COMMAND', 'BREAKGLASS_TOOLBOX'])).size() == 0 && c.?envFrom.orValue([]).size() == 0\n           \
        \  && c.?ports.orValue([]).size() == 0 && c.?volumeDevices.orValue([]).size() == 0\n             && c.securityContext.privileged\
        \ == false\n             && c.securityContext.allowPrivilegeEscalation == false\n             && c.securityContext.readOnlyRootFilesystem\
        \ == true\n             && c.securityContext.capabilities.drop == ['ALL']\n             && c.securityContext.capabilities.?add.orValue([]).size()\
        \ == 0\n             && c.securityContext.?procMount.orValue('Default') == 'Default'\n             && c.?volumeMounts.orValue([]).filter(m,\
        \ !(m.name in ['breakglass-motd', 'breakglass-toolbox'])).all(m, !has(m.subPath) && !has(m.subPathExpr) && !has(m.mountPropagation)\n\
        \                  && ((m.name == 'etcd-pki' && m.mountPath == '/etc/etcd-pki' && m.?readOnly.orValue(false) == true)\n\
        \                      || (m.name == 'snapshots' && m.mountPath == '/snapshots'))))\n        && (request.kind.kind\
        \ == 'Job' ? object.spec.template.spec : object.spec).initContainers.all(c, c.?env.orValue([]).size() == 0\n     \
        \        && c.?volumeMounts.orValue([]).all(m, !(m.name in ['breakglass-motd', 'breakglass-toolbox'])\n          \
        \        && !(m.mountPath in ['/etc/breakglass-motd', '/opt/breakglass/toolbox'])))\n        && (request.kind.kind\
        \ == 'Job' ? object.spec.template.spec : object.spec).?volumes.orValue([]).filter(v, !(v.name in ['breakglass-motd',\
