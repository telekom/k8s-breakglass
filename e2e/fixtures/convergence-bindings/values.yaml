      recordingRetention: 365d
    notification:
      enabled: true
      notifyOnRequest: true
      notifyOnApproval: true
      notifyOnExpiry: true
      notifyOnTermination: true
    requestReason:
      mandatory: true
      minLength: 40
      maxLength: 900
      description: 'Provide the CA-SM or HPSM incident ID, the control-plane node, the endpoint status of all members (DB
        SIZE and IN USE) and the defrag order: the leader last, one member per session, each only after the previous session
