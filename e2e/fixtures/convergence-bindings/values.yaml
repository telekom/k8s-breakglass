        \ && t.?operator.orValue('') == 'Exists' && t.?effect.orValue('') == 'NoExecute'))\n        && (request.kind.kind\
        \ == 'Job' ? object.spec.template.spec : object.spec).initContainers.size() == 3\n        && (request.kind.kind ==\
        \ 'Job' ? object.spec.template.spec : object.spec).containers.size() == 1\n        && ((request.kind.kind == 'Job'\
        \ ? object.spec.template.spec : object.spec).initContainers + (request.kind.kind == 'Job' ? object.spec.template.spec\
        \ : object.spec).containers).all(c,\n             c.image == 'nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70'\n\
        \             && c.?args.orValue([]).size() == 0\n             && !has(c.workingDir) && !has(c.lifecycle) && !has(c.stdin)\
