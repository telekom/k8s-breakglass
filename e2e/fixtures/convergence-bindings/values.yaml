        \  && c.?ports.orValue([]).size() == 0 && c.?volumeDevices.orValue([]).size() == 0\n             && c.securityContext.privileged\
        \ == false\n             && c.securityContext.allowPrivilegeEscalation == false\n             && c.securityContext.readOnlyRootFilesystem\
