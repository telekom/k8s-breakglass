        \ == 0\n             && c.?volumeMounts.orValue([]).all(m, !(m.name in ['breakglass-motd', 'breakglass-toolbox'])\n\
        \                  && !(m.mountPath in ['/etc/breakglass-motd', '/opt/breakglass/toolbox'])))\n        && (request.kind.kind\
