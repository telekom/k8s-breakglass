resources:
- apiVersion: breakglass.t-caas.telekom.com/v1alpha1
  kind: DebugPodTemplate
  metadata:
    name: convergence-tenant-network-tools
  spec:
    displayName: Tenant Network Diagnostics
    description: No-token network diagnostic pod for DNS, egress, service, and connectivity troubleshooting.
    template:
      metadata:
        labels:
          breakglass.t-caas.telekom.com/profile: tenant-network-diagnostics
          breakglass.t-caas.telekom.com/audit: required
      spec:
        automountServiceAccountToken: false
        enableServiceLinks: false
        restartPolicy: Never
        terminationGracePeriodSeconds: 10
        imagePullSecrets:
        - name: unused-e2e-pull-secret
        nodeSelector:
          kubernetes.io/os: linux
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: netshoot
          image: nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          imagePullPolicy: IfNotPresent
          command:
          - /bin/sh
          - -c
          - exec timeout 4h sleep 4h
          env:
          - name: HOME
            value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
          - name: tmp
            mountPath: /tmp
        volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
- apiVersion: breakglass.t-caas.telekom.com/v1alpha1
  kind: DebugSessionTemplate
  metadata:
    name: convergence-platform-diagnostics
  spec:
    motd:
      message: E2E convergence diagnostics; use only the disposable test cluster.
    displayName: Platform Diagnostics
    description: Approved platform diagnostic shell for cluster-wide workload, DNS, egress, and service checks without host
      namespaces.
    mode: workload
    podTemplateRef:
      name: convergence-tenant-network-tools
    workloadType: DaemonSet
    replicas: 1
    targetNamespace: breakglass-debug
    failMode: closed
    constraints:
      maxDuration: 2h
      defaultDuration: 30m
      allowRenewal: false
      maxRenewals: 0
      maxConcurrentSessions: 2
    namespaceConstraints:
      defaultNamespace: breakglass-debug
      allowUserNamespace: false
      createIfNotExists: false
    allowedPodOperations:
      exec: true
      attach: true
      logs: true
      portForward: false
    audit:
      enabled: true
      enableShellHistory: true
      enableTerminalRecording: false
      recordingRetention: 90d
    notification:
      enabled: true
      notifyOnRequest: true
      notifyOnApproval: true
      notifyOnExpiry: true
      notifyOnTermination: true
    requestReason:
      mandatory: true
      minLength: 30
      maxLength: 700
      description: Provide incident, affected services, customer impact, and planned diagnostic checks.
    approvalReason:
      mandatory: true
      mandatoryForRejection: true
      minLength: 10
      description: Approver must record why platform diagnostics are justified.
    expirationBehavior: terminate
    gracePeriodBeforeExpiry: 10m
- apiVersion: breakglass.t-caas.telekom.com/v1alpha1
  kind: DebugSessionTemplate
  metadata:
    name: convergence-platform-node-diagnostics
  spec:
    motd:
      message: E2E convergence diagnostics; use only the disposable test cluster.
    displayName: Platform Node Diagnostics
    description: Approved platform emergency node debug session with host network and PID inspection.
    mode: kubectl-debug
    targetNamespace: breakglass-debug
    failMode: closed
    kubectlDebug:
      ephemeralContainers:
        enabled: false
      nodeDebug:
        enabled: true
        allowedImages:
        - nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
        hostNamespaces:
          hostNetwork: true
          hostPID: true
          hostIPC: false
      podCopy:
        enabled: false
    requiredAuxiliaryResourceCategories:
    - policy-exceptions
    auxiliaryResources:
    - name: node-debug-policy-exception
      category: policy-exceptions
      description: Permit only this approved session's controller-built node debug Pod.
      createBefore: true
      deleteAfter: true
      failurePolicy: fail
      templateString: "apiVersion: policies.kyverno.io/v1\nkind: PolicyException\nmetadata:\n  name: {{ printf `debug-node-%s`\
        \ (required `session UID is required` .session.uid) | yamlQuote }}\n  namespace: convergence-security\n  labels:\n    app.kubernetes.io/managed-by:\
        \ breakglass\n    breakglass.telekom.com/debug-session: {{ .session.name | yamlQuote }}\nspec:\n  policyRefs:\n  \
        \  - {kind: ValidatingPolicy, name: disallow-host-namespaces}\n    - {kind: ValidatingPolicy, name: disallow-host-path}\n\
        \    - {kind: ValidatingPolicy, name: ensure-readonly-hostpath}\n    - {kind: ValidatingPolicy, name: restrict-volume-types}\n\
        \    - {kind: ValidatingPolicy, name: require-ro-rootfs}\n    - {kind: ValidatingPolicy, name: restrict-controlplane-scheduling}\n\
        \  matchConditions:\n    - name: controller-actor\n      expression: >-\n        request.userInfo.username == 'kubernetes-admin'\n\
        \        && request.userInfo.?groups.orValue([]).exists(g, g in ['system:masters', 'kubeadm:cluster-admins'])\n  \
        \  - name: approved-session\n      expression: {{ printf `request.operation in ['CREATE', 'UPDATE'] && request.kind.kind\
        \ == 'Pod' && request.namespace == %q && object.metadata.?annotations.orValue({})[?'breakglass.t-caas.telekom.com/source-session-uid'].orValue('')\
        \ == %q && object.metadata.?labels.orValue({})[?'breakglass.telekom.com/debug-session'].orValue('') == %q` (required\
        \ `target namespace is required` .target.namespace) (required `session UID is required` .session.uid) (required `session\
        \ name is required` .session.name) | yamlQuote }}\n    - name: approved-node\n      expression: >-\n        object.metadata.name.startsWith('node-debugger-')\n\
        \        && object.metadata.?labels.orValue({})[?'breakglass.telekom.com/node-debug'].orValue('') == 'true'\n    \
        \    && object.spec.?nodeName.orValue('') != ''\n        && object.metadata.?labels.orValue({})[?'breakglass.telekom.com/target-node'].orValue('')\
        \ == object.spec.nodeName\n    - name: exact-node-debug-pod\n      expression: >-\n        object.spec.?hostNetwork.orValue(false)\n\
        \        && object.spec.?hostPID.orValue(false)\n        && !object.spec.?hostIPC.orValue(false)\n        && object.spec.?restartPolicy.orValue('')\
        \ == 'Never'\n        && object.spec.?serviceAccountName.orValue('default') == 'default'\n        && object.spec.?securityContext.?sysctls.orValue([]).size()\
        \ == 0\n        && object.spec.?initContainers.orValue([]).size() == 0\n        && object.spec.?ephemeralContainers.orValue([]).size()\
        \ == 0\n        && object.spec.?tolerations.orValue([]).size() == 1\n        && object.spec.tolerations.all(t, !has(t.key)\
        \ && t.?operator.orValue('') == 'Exists' && !has(t.effect))\n        && object.spec.containers.size() == 1\n     \
        \   && object.spec.containers.all(c,\n             c.name == 'debugger'\n             && c.image == 'nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70'\n\
        \             && c.?command.orValue([]) == ['sleep', 'infinity']\n             && c.?args.orValue([]).size() == 0\n\
        \             && c.?ports.orValue([]).size() == 0\n             && c.?env.orValue([]).filter(e, !(e.name in ['BREAKGLASS_MOTD',\
        \ 'BREAKGLASS_RUNBOOK_URL', 'ENV', 'PROMPT_COMMAND', 'BREAKGLASS_TOOLBOX'])).size() == 0\n             && c.?envFrom.orValue([]).size()\
        \ == 0\n             && c.?volumeDevices.orValue([]).size() == 0\n             && !has(c.lifecycle) && !has(c.workingDir)\n\
        \             && !has(c.startupProbe) && !has(c.livenessProbe) && !has(c.readinessProbe)\n             && c.?securityContext.?privileged.orValue(false)\n\
        \             && c.?securityContext.?capabilities.?add.orValue([]).size() == 0\n             && c.?volumeMounts.orValue([]).filter(m,\
        \ !(m.name in ['breakglass-motd', 'breakglass-toolbox'])).exists(m, m.name == 'host-root')\n             && c.?volumeMounts.orValue([]).filter(m,\
        \ !(m.name in ['breakglass-motd', 'breakglass-toolbox'])).all(m,\n                  !has(m.subPath) && !has(m.subPathExpr)\
        \ && !has(m.mountPropagation)\n                  && ((m.name == 'host-root' && m.mountPath == '/host')\n         \
        \             || (m.name.startsWith('kube-api-access-')\n                          && m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount'\n\
        \                          && m.?readOnly.orValue(false)))))\n        && object.spec.?volumes.orValue([]).filter(v,\
        \ !(v.name in ['breakglass-motd', 'breakglass-toolbox'])).filter(v, v.name == 'host-root').size() == 1\n        &&\
        \ object.spec.?volumes.orValue([]).filter(v, !(v.name in ['breakglass-motd', 'breakglass-toolbox'])).filter(v, v.name.startsWith('kube-api-access-')).size()\
        \ <= 1\n        && object.spec.?volumes.orValue([]).filter(v, !(v.name in ['breakglass-motd', 'breakglass-toolbox'])).all(v,\n\
        \             (v.name == 'host-root' && has(v.hostPath) && v.hostPath.path == '/'\n              && v.hostPath.?type.orValue('')\
        \ == '')\n             || (v.name.startsWith('kube-api-access-') && has(v.projected)\n                 && v.projected.sources.all(s,\n\
        \                      (has(s.serviceAccountToken) && s.serviceAccountToken.?audience.orValue('') == '')\n       \
        \               || (has(s.configMap) && s.configMap.name == 'kube-root-ca.crt')\n                      || (has(s.downwardAPI)\n\
        \                          && s.downwardAPI.items.all(i, i.?fieldRef.?fieldPath.orValue('') == 'metadata.namespace')))))\n\
        \    - name: breakglass-motd-hook\n      expression: >-\n        (object.spec.?volumes.orValue([]).all(v, v.name !=\
        \ 'breakglass-motd')\n          && object.spec.containers.all(c,\n               c.?volumeMounts.orValue([]).all(m,\
        \ m.name != 'breakglass-motd' && m.mountPath != '/etc/breakglass-motd')\n               && c.?env.orValue([]).all(e,\
        \ !(e.name in ['BREAKGLASS_MOTD', 'BREAKGLASS_RUNBOOK_URL', 'ENV', 'PROMPT_COMMAND']))))\n        || (object.spec.?volumes.orValue([]).filter(v,\
        \ v.name == 'breakglass-motd').size() == 1\n          && object.spec.volumes.filter(v, v.name == 'breakglass-motd').all(v,\n\
        \               has(v.downwardAPI) && !has(v.hostPath) && !has(v.emptyDir) && !has(v.configMap) && !has(v.secret)\
        \ && !has(v.projected)\n               && v.downwardAPI.?items.orValue([]).size() == 1\n               && v.downwardAPI.items.all(i,\
        \ i.path == 'profile.sh'\n                    && i.?fieldRef.?fieldPath.orValue('') == \"metadata.annotations['breakglass.t-caas.telekom.com/motd-profile']\"\
        \n                    && !has(i.resourceFieldRef) && !has(i.mode)))\n          && object.spec.containers.all(c,\n\
        \               c.?volumeMounts.orValue([]).filter(m, m.name == 'breakglass-motd' || m.mountPath == '/etc/breakglass-motd').size()\
        \ == 1\n               && c.volumeMounts.filter(m, m.name == 'breakglass-motd').size() == 1\n               && c.volumeMounts.filter(m,\
        \ m.name == 'breakglass-motd').all(m, m.mountPath == '/etc/breakglass-motd'\n                    && m.?readOnly.orValue(false)\
        \ == true && !has(m.subPath) && !has(m.subPathExpr) && !has(m.mountPropagation))\n               && c.?env.orValue([]).filter(e,\
        \ e.name == 'BREAKGLASS_MOTD').size() == 1\n               && c.env.filter(e, e.name == 'BREAKGLASS_RUNBOOK_URL').size()\
        \ <= 1\n               && c.env.filter(e, e.name in ['BREAKGLASS_MOTD', 'BREAKGLASS_RUNBOOK_URL']).all(e, has(e.value)\
        \ && !has(e.valueFrom))\n               && c.env.filter(e, e.name == 'ENV').size() == 1\n               && c.env.filter(e,\
        \ e.name == 'ENV').all(e, e.?value.orValue('') == '/etc/breakglass-motd/profile.sh' && !has(e.valueFrom))\n      \
        \         && c.env.filter(e, e.name == 'PROMPT_COMMAND').size() == 1\n               && c.env.filter(e, e.name ==\
        \ 'PROMPT_COMMAND').all(e, e.?value.orValue('') == '. /etc/breakglass-motd/profile.sh' && !has(e.valueFrom))))\n \
        \   - name: breakglass-toolbox\n      expression: >-\n        (object.spec.?volumes.orValue([]).all(v, v.name != 'breakglass-toolbox')\n\
        \          && object.spec.containers.all(c, c.?volumeMounts.orValue([]).all(m, m.name != 'breakglass-toolbox' && m.mountPath\
        \ != '/opt/breakglass/toolbox') && c.?env.orValue([]).all(e, e.name != 'BREAKGLASS_TOOLBOX')))\n"
    constraints:
      maxDuration: 1h
      defaultDuration: 20m
      allowRenewal: false
      maxRenewals: 0
      maxConcurrentSessions: 1
    namespaceConstraints:
      defaultNamespace: breakglass-debug
      allowUserNamespace: false
      createIfNotExists: false
    allowedPodOperations:
      exec: true
      attach: true
      logs: true
      portForward: false
    audit:
      enabled: true
      enableShellHistory: true
      enableTerminalRecording: false
      recordingRetention: 365d
    notification:
      enabled: true
      notifyOnRequest: true
      notifyOnApproval: true
      notifyOnExpiry: true
      notifyOnTermination: true
    requestReason:
      mandatory: true
      minLength: 30
      maxLength: 700
      description: Provide incident, affected node, customer impact, and planned commands.
    approvalReason:
      mandatory: true
      mandatoryForRejection: true
      minLength: 10
      description: Approver must record why host-level diagnostics are justified.
    expirationBehavior: terminate
    gracePeriodBeforeExpiry: 10m
