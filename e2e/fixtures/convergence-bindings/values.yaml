      enabled: true
      enableShellHistory: true
      enableTerminalRecording: false
      recordingRetention: 365d
    notification:
      enabled: true
      notifyOnRequest: true
      notifyOnApproval: true
      notifyOnExpiry: true
      notifyOnTermination: true
    requestReason:
      mandatory: true
      minLength: 40
      maxLength: 900
      description: Provide incident, impacted services, why normal access is insufficient, and planned commands.
