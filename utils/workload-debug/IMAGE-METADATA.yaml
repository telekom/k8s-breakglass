schemaVersion: 1
image:
  name: ghcr.io/telekom/k8s-breakglass/utils/workload-debug
  version: 0.1.0
  platforms:
    - linux/amd64
    - linux/arm64
  base:
    name: alpine:3.24
    digest: sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  # Package versions follow the digest-pinned base above. The build upgrades
  # the inherited set and installs these packages unversioned; the installed
  # versions are recorded in the image and in the generated SPDX SBOM.
  installedPackages: /usr/share/breakglass/installed-packages
  packages:
    - bash
    - bind-tools
    - ca-certificates
    - curl
    - jq
    - openssl
    - tini
  user: "65532:65532"
  readOnlyRootFilesystem: true
  capabilities: []
  controllerMetadataRequired: false
provenance:
  source: https://github.com/telekom/k8s-breakglass/tree/main/utils/workload-debug
  license: Apache-2.0
  sbom:
    format: spdx-json
    command: syft OCI_IMAGE -o spdx-json=sbom.spdx.json
  signing:
    tool: cosign
    mode: keyless
    commands:
      - cosign sign --yes IMAGE@DIGEST
      - cosign verify IMAGE@DIGEST --certificate-identity-regexp 'https://github.com/telekom/k8s-breakglass/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
