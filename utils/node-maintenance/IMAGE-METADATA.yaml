schemaVersion: 1
image:
  name: ghcr.io/telekom/k8s-breakglass/utils/node-maintenance
  intent: node-maintenance
  platforms: [linux/amd64, linux/arm64]
  base:
    name: alpine:3.24
    digest: sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  # Package versions follow the digest-pinned base; the installed versions are
  # recorded in the image and in the generated SPDX SBOM.
  installedPackages: /usr/share/breakglass/installed-packages
  packages: [ethtool, flock, iproute2, kmod, sed]
  user: "0:0 (controller-selected operation only)"
  capabilities: [NET_ADMIN, SYS_BOOT, SYS_MODULE]
  operationCapabilities:
    node-recovery: []
    network-repair: [NET_ADMIN]
    network-repair-preview: []
    kexec-recovery-validate: []
    kexec-recovery: [SYS_BOOT]
    service-restart: []
    module-load: [SYS_MODULE]
    sriov-reprovision: []
    hotfix-action-file: [CHOWN, FOWNER, DAC_OVERRIDE]
    # The host-namespace shape is privileged with host PID instead of capabilities.
    hotfix-action-host: []
  controllerDeadline:
    environment: BREAKGLASS_ACTION_DEADLINE_UNIX
    operation: [network-repair, kexec-recovery, service-restart, module-load, sriov-reprovision, hotfix-action-file, hotfix-action-host]
    checks: [before-preflight, before-mutation]
  runbooks: /usr/share/breakglass/runbooks/upstream/node-maintenance
  internalRunbookMount: /usr/share/breakglass/runbooks/internal
  attestations: [sbom, provenance, signature]
