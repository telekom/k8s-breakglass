---
schemaVersion: 1
intent: network-diagnostics
image: network-debug
failurePolicy:
  unavailableFeature: fail
  messagePrefix: REQUIREMENT
checks:
  - id: helper-report
    operation: deterministic-report
    tools: [net-debug, net-report, ip, ss]
  - id: connectivity
    operation: loopback-and-fixture-traffic
    tools: [curl, nc, ping, tracepath, traceroute, mtr, ethtool]
  - id: dns-tls-http
    operation: fixture-dns-and-http-plus-local-tls
    tools: [dig, host, nslookup, curl]
  - id: packet-capture
    operation: bounded-image-owned-capture
    tools: [net-debug, tcpdump]
    requirements: [CAP_NET_RAW, writable-work-mount]
    bounds: {durationSeconds: [1, 300], packets: [1, 10000], snaplenBytes: [64, 256], filterCharacters: 256}
  - id: selected-pod-capture
    operation: exact-pod-uid-to-netns-bounded-capture
    tools: [pod-netns-capture, tcpdump]
    requirements: [linux-kernel, hostPID, non-hostNetwork, CAP_SYS_ADMIN, CAP_SYS_PTRACE, CAP_NET_RAW, recognized-kubernetes-cgroup-layout, disposable-kind-cluster, owner-only-emptyDir]
    prohibited: [caller-pid, caller-pod-name, caller-node-name, shell-argv, hostPath, CRI-socket, privileged, hostNetwork]
    targetRepresentations: [canonical-dashed-uid, systemd-underscore-escaped-uid, systemd-backslash-x2d-escaped-uid]
    bounds: {durationSeconds: [1, 300], packets: [1, 10000], snaplenBytes: [64, 256], filterBytes: 256, outputFilenameBytes: 64}
  - id: kernel-packet-tracing
    operation: bounded-image-owned-host-netns-trace
    tools: [net-debug, pwru]
    requirements: [host-network-namespace, linux-kernel, kernel-btf, debugfs, tracefs, securityfs, CAP_BPF, CAP_PERFMON, CAP_NET_ADMIN, CAP_SYS_RESOURCE, writable-work-mount]
    bounds: {durationSeconds: [1, 60], events: [1, 10000], filterCharacters: 256}
bounded:
  commandTimeoutSeconds: 20
  captureDurationSeconds: 300
  capturePackets: 10000
  captureSnaplenBytes: 256
  traceDurationSeconds: 60
  traceEvents: 10000
  filterCharacters: 256
  packetTraceTimeoutSeconds: 20
  selectedPodCaptureDurationSeconds: 300
  selectedPodCapturePackets: 10000
  selectedPodCaptureSnaplenBytes: 256
  selectedPodCaptureFilterBytes: 256
  selectedPodCaptureOutputFilenameBytes: 64
cleanup:
  container: required
  networkNamespace: required
  networkDiagnosticsPod: required
  selectedPodCaptureJob: required
  selectedPodCaptureEvidence: required
