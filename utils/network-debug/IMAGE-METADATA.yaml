---

schemaVersion: 1
image:
  name: ghcr.io/telekom/k8s-breakglass/utils/network-debug
  version: 0.1.0
  intent: network-diagnostics
  platforms:
    - linux/amd64
    - linux/arm64
  base:
    name: ghcr.io/nicolaka/netshoot:v0.16
    digest: sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
    source: https://github.com/nicolaka/netshoot/tree/v0.16
    inheritedRuntimeTools:
      - bash
      - bind-tools
      - busybox-extras
      - curl
      - ethtool
      - iproute2
      - iputils
      - jq
      - mtr
      - netcat-openbsd
      - tcpdump
      - util-linux
    inheritedCommands:
      - curl
      - dig
      - host
      - nslookup
      - nc
      - ping
      - tracepath
      - traceroute
      - mtr
      - ip
      - ss
      - tcpdump
      - ethtool
      - jq
    additions:
      - pwru
      - pod-netns-capture
      - net-debug
      - net-report
      - network-debug-profile.sh
      - README.md
      - RUNBOOK.md
      - MOTD
  build:
    name: golang:1.27
    digest: sha256:c5b07c17f54c5f22230c4b4da6e90249165cf55368e01a52808cb92064e18836
  dependencyLock: versions.env
  user: "0:0"
  capabilities:
    - NET_RAW
    - NET_ADMIN
    - BPF
    - PERFMON
    - SYS_RESOURCE
    - SYS_ADMIN
    - SYS_PTRACE
  selectedPodCaptureCapabilities:
    - NET_RAW
    - SYS_ADMIN
    - SYS_PTRACE
  operationCapabilities:
    podNamespaceCapture: [NET_RAW]
    selectedPodCapture: [NET_RAW, SYS_ADMIN, SYS_PTRACE]
    hostNamespaceTrace: [BPF, PERFMON, NET_ADMIN, SYS_RESOURCE, SYS_PTRACE]
  droppedCapabilities:
    hostNamespaceTrace: [NET_RAW]
provenance:
  source: https://github.com/telekom/k8s-breakglass/tree/main/utils/network-debug
  license: Apache-2.0
  sbom:
    format: spdx-json
    command: syft OCI_IMAGE -o spdx-json=sbom.spdx.json
  signing:
    tool: cosign
    mode: keyless
    commands:
      - cosign sign --yes IMAGE@DIGEST
      - cosign verify IMAGE@DIGEST --certificate-identity-regexp 'https://github.com/telekom/k8s-breakglass/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
