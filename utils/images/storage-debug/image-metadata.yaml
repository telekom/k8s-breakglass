---

image: ghcr.io/telekom/k8s-breakglass/utils/storage-debug
context: utils/images/storage-debug
platforms:
  - linux/amd64
  - linux/arm64
base:
  image: alpine:3.24
  digest: sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
builder:
  image: golang:1.27.3
  digest: sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
dependencyLock: versions.env
# kubestr and its Go modules are selected by the Dependabot-tracked
# kubestr/go.mod; Alpine package versions follow the digest-pinned base and are
# recorded at build time. versionSource names where each version is recorded.
moduleLock: kubestr/go.mod
installedPackages: /usr/share/breakglass/installed-packages
runtime:
  user: "65532:65532"
  writable_paths:
    - /scratch
    - /reports
  capabilities: []
  privileged: false
  network_required: operation-dependent
dependencies:
  - name: github.com/kastenhq/kubestr
    versionSource: kubestr/go.mod
  - name: golang.org/x/net
    versionSource: kubestr/go.mod
  - name: golang.org/x/text
    versionSource: kubestr/go.mod
  - name: fio
    versionSource: /usr/share/breakglass/installed-packages
  - name: ioping
    versionSource: /usr/share/breakglass/installed-packages
contract:
  schema_version: storage-diagnostics/v1
  executable: /usr/local/bin/storage-diagnostics
  intents:
    - storage-diagnostics
  modes:
    - mounted-volume
    - performance
    - snapshot-restore
    - snapshot-source-clone
    - block-volume
    - plan
    - docs
    - runbook
  bounds:
    size_mib: 1024
    runtime_seconds: 60
    ioping_count: 20
  provider_owned:
    - namespace
    - workload-image-digest
    - runner-owner-identity
    - image-pull-secrets
    - service-account
    - rbac
    - admission-policy
    - optional-read-only-internal-runbook-image-volume
  denied_user_input:
    - command
    - image
    - namespace
    - node-selector
    - fio-file
    - test-name
    - capability
    - service-account
    - rbac
attestations:
  sbom: required
  provenance: required
  signature: cosign-keyless
signing:
  tool: cosign
  identity: keyless
  verify_command: cosign verify IMAGE@DIGEST
