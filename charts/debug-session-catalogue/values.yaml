# Cluster-scoped templates only; this chart does not create namespaces, RBAC,
# ClusterConfig resources, or images. Pre-create targetNamespace.
enabled: true

# Empty lists intentionally grant no access and target no clusters.
requesters:
  groups: []
  users: []
approvers:
  groups: []
  users: []
targets:
  clusters: []
  clusterSelector: {}

targetNamespace: breakglass-debug
defaultDuration: 30m
maxDuration: 1h
maxConcurrentSessions: 1
imagePullPolicy: IfNotPresent

# Replace these public, versioned utility images with approved images. Digests
# are supported by setting image.digest.
images:
  workload: {repository: ghcr.io/telekom/k8s-breakglass/workload-debug, tag: "0.1.0"}
  network: {repository: ghcr.io/telekom/k8s-breakglass/network-debug, tag: "0.1.0"}
  storage: {repository: ghcr.io/telekom/k8s-breakglass/storage-debug, tag: "0.1.0"}
  dumpAccess: {repository: ghcr.io/telekom/k8s-breakglass/dump-reader, tag: "0.1.0"}
  networkRepair: {repository: ghcr.io/telekom/k8s-breakglass/node-maintenance, tag: "0.1.0"}
  nodeRecovery: {repository: ghcr.io/telekom/k8s-breakglass/node-maintenance, tag: "0.1.0"}
  clusterValidation: {repository: ghcr.io/telekom/k8s-breakglass/cluster-validator, tag: "0.1.0"}

# Ordered, extensible profile list. Map-shaped profiles from versions before
# 0.2.0 must be converted to list items (see the chart README).
profiles:
  - name: workload-diagnostics
    intent: workload-diagnostics
    displayName: Workload diagnostics
    description: Inspect a workload from an isolated, non-privileged pod.
    enabled: true
    elevated: false
    imageKey: workload
    command: ["/usr/local/bin/workload-debug"]
    args: ["report"]
  - name: network-diagnostics
    intent: network-diagnostics
    displayName: Network diagnostics
    description: Inspect DNS and network connectivity from an isolated pod.
    enabled: true
    elevated: false
    imageKey: network
    command: ["/usr/local/bin/net-debug"]
    args: ["report"]
  - name: storage-diagnostics
    intent: storage-diagnostics
    displayName: Storage diagnostics
    description: Inspect ephemeral storage from an isolated pod.
    enabled: true
    elevated: false
    imageKey: storage
    command: ["/usr/local/bin/storage-report"]
    args: ["--path", "/workspace"]
    pod:
      volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
  - name: dump-access
    intent: dump-access
    displayName: Dump access (opt-in)
    description: >-
      Read approved existing dump files; requires explicit elevated opt-in.
    enabled: false
    elevated: false
    requiredElevation: true
    imageKey: dumpAccess
    command: ["sh", "-c"]
    args:
      - >-
        echo 'Dump reader ready; provide an approved read-only command'; while
        true; do sleep 3600; done
    preset: elevated-node
    capabilities: []
  - name: network-repair
    intent: network-repair
    displayName: Network repair (opt-in)
    description: >-
      Perform network repair actions on a target node; requires explicit
      elevated opt-in.
    enabled: false
    elevated: false
    requiredElevation: true
    imageKey: networkRepair
    command: ["/usr/local/bin/node-maintenance"]
    args: ["network-repair"]
    preset: elevated-node
    capabilities: [NET_ADMIN]
  - name: node-recovery
    intent: node-recovery
    displayName: Node recovery (opt-in)
    description: Inspect and recover a node; requires explicit elevated opt-in.
    enabled: false
    elevated: false
    requiredElevation: true
    imageKey: nodeRecovery
    command: ["/usr/local/bin/node-maintenance"]
    args: ["node-recovery"]
    preset: elevated-node
    privileged: true
    hostPID: true
  - name: cluster-validation
    intent: cluster-validation
    displayName: Cluster validation
    description: Run read-only cluster validation checks from an isolated pod.
    enabled: true
    elevated: false
    imageKey: clusterValidation
    command: ["/cluster-validator"]
    args: ["--mode", "one-time"]
