{{- if .Values.enabled }}
{{- $seenProfiles := dict }}
{{- range $index, $profile := .Values.profiles }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $profile.name) }}{{ fail (printf "profiles[%d].name must be DNS-safe" $index) }}{{ end }}
{{- if hasKey $seenProfiles $profile.name }}{{ fail (printf "profiles contains duplicate name %s" $profile.name) }}{{ end }}
{{- $_ := set $seenProfiles $profile.name true }}
{{- $_ := include "debug-session-catalogue.image" (dict "root" $ "profile" $profile) }}
{{- $_ := include "debug-session-catalogue.validatePodOverrides" (dict "profile" $profile) }}
{{- $_ := include "debug-session-catalogue.serviceAccount" (dict "profile" $profile) }}
{{- if and $profile.enabled $profile.requiredElevation (not $profile.elevated) }}{{ fail (printf "profiles[%s] requires explicit elevated: true when enabled" $profile.name) }}{{ end }}
{{- if $profile.enabled }}
apiVersion: breakglass.t-caas.telekom.com/v1alpha1
kind: DebugPodTemplate
metadata:
  name: {{ include "debug-session-catalogue.profileName" (dict "root" $ "profile" $profile) }}
  labels:
    {{- include "debug-session-catalogue.labels" $ | nindent 4 }}
    breakglass.t-caas.telekom.com/catalogue-profile: {{ $profile.name | quote }}
    breakglass.t-caas.telekom.com/catalogue-intent: {{ $profile.intent | quote }}
    breakglass.t-caas.telekom.com/elevated: {{ default false $profile.elevated | quote }}
spec:
  displayName: {{ required (printf "profiles[%s].displayName is required" $profile.name) $profile.displayName | quote }}
  description: {{ required (printf "profiles[%s].description is required" $profile.name) $profile.description | quote }}
  template:
    spec:
      {{- include "debug-session-catalogue.podSecurity" (dict "profile" $profile) | nindent 6 }}
      containers:
        - name: debug
          image: {{ include "debug-session-catalogue.image" (dict "root" $ "profile" $profile) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command:
{{ toYaml $profile.command | nindent 12 }}
          args:
{{ toYaml $profile.args | nindent 12 }}
          {{- $validatorIdentity := eq (default "" $profile.intent) "cluster-validation" }}
          {{- if or $validatorIdentity (and $profile.pod $profile.pod.env) }}
          env:
          {{- if $validatorIdentity }}
{{ include "debug-session-catalogue.validatorIdentity" (dict "profile" $profile) | nindent 12 }}
          {{- end }}
          {{- with $profile.pod }}
          {{- with .env }}
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- include "debug-session-catalogue.containerSecurity" (dict "profile" $profile) | nindent 10 }}
          {{- include "debug-session-catalogue.resources" $ | nindent 10 }}
          {{- with $profile.pod }}
          {{- with .volumeMounts }}
          volumeMounts:
{{ toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- with $profile.pod }}
      {{- with .volumes }}
      volumes:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- include "debug-session-catalogue.serviceAccount" (dict "profile" $profile) | nindent 6 }}
      enableServiceLinks: false
      hostNetwork: {{ default false $profile.hostNetwork }}
      hostPID: {{ if and $profile.elevated (default false $profile.hostPID) }}true{{ else }}false{{ end }}
      hostIPC: false
      {{- with $profile.pod }}
      {{- with .nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      restartPolicy: Never
---
{{- end }}
{{- end }}
{{- end }}
