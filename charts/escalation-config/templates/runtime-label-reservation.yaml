{{- /*
Mirrors config/components/runtime-label-reservation/policy.yaml; keep both in
sync (charts/escalation-config/ci/test-runtime-label-reservation.sh compares them).
*/ -}}
{{- $r := .Values.runtimeLabelReservation | default dict -}}
{{- if $r.enabled }}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail "runtimeLabelReservation.enabled requires Kubernetes 1.30 or newer" }}
{{- end }}
{{- if not (or $r.controllerUsers $r.controllerGroups) }}
{{- fail "runtimeLabelReservation.controllerUsers or controllerGroups must name the identity the breakglass controller uses on this cluster" }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: breakglass-runtime-label-reservation
  labels:
    {{- include "escalation-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/status", "pods/ephemeralcontainers", "pods/binding", "bindings"]
    # DELETE: an orphaning delete would detach the workload's marked children.
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["replicationcontrollers", "replicationcontrollers/status"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["deployments", "deployments/status", "replicasets", "replicasets/status",
                  "statefulsets", "statefulsets/status", "daemonsets", "daemonsets/status"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["jobs", "jobs/status", "cronjobs", "cronjobs/status"]
  variables:
  - name: controllerUsers
    expression: {{ $r.controllerUsers | default list | toJson | quote }}
  - name: controllerGroups
    expression: {{ $r.controllerGroups | default list | toJson | quote }}
  - name: workloadControllerUsers
    expression: {{ $r.workloadControllerUsers | default list | toJson | quote }}
  - name: newMeta
    expression: >-
      object.kind in ['Pod', 'Binding'] ? object.metadata :
      object.kind == 'CronJob' ? (has(object.spec.jobTemplate.spec.template.metadata) ? object.spec.jobTemplate.spec.template.metadata : {}) :
      (has(object.spec.template) && has(object.spec.template.metadata) ? object.spec.template.metadata : {})
  - name: oldMeta
    expression: >-
      oldObject == null ? {} :
      oldObject.kind in ['Pod', 'Binding'] ? oldObject.metadata :
      oldObject.kind == 'CronJob' ? (has(oldObject.spec.jobTemplate.spec.template.metadata) ? oldObject.spec.jobTemplate.spec.template.metadata : {}) :
      (has(oldObject.spec.template) && has(oldObject.spec.template.metadata) ? oldObject.spec.template.metadata : {})
  # What runs: the Pod spec, or the pod template spec of a workload.
  - name: newSpec
    expression: >-
      object.kind == 'Binding' ? null :
      object.kind == 'Pod' ? object.spec :
      object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
      (has(object.spec.template) && has(object.spec.template.spec) ? object.spec.template.spec : null)
  - name: oldSpec
    expression: >-
      oldObject == null || oldObject.kind == 'Binding' ? null :
      oldObject.kind == 'Pod' ? oldObject.spec :
      oldObject.kind == 'CronJob' ? oldObject.spec.jobTemplate.spec.template.spec :
      (has(oldObject.spec.template) && has(oldObject.spec.template.spec) ? oldObject.spec.template.spec : null)
  - name: newReserved
    expression: >-
      (has(variables.newMeta.labels) ? variables.newMeta.labels.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'label ' + k + '=' + variables.newMeta.labels[k]) : []) +
      (has(variables.newMeta.annotations) ? variables.newMeta.annotations.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'annotation ' + k + '=' + variables.newMeta.annotations[k]) : [])
  - name: oldReserved
    expression: >-
      (has(variables.oldMeta.labels) ? variables.oldMeta.labels.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'label ' + k + '=' + variables.oldMeta.labels[k]) : []) +
      (has(variables.oldMeta.annotations) ? variables.oldMeta.annotations.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'annotation ' + k + '=' + variables.oldMeta.annotations[k]) : [])
  # Ownership, selection and finalizers: changing them can detach a marked
  # ReplicaSet or Pod from the workload the controller cleans up, or hold the
  # workload after its delete, so it would outlive the session. Removing
  # finalizers stays allowed (the garbage collector does that).
  - name: newOwners
    expression: "has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []"
  - name: oldOwners
    expression: "oldObject == null || !has(oldObject.metadata.ownerReferences) ? [] : oldObject.metadata.ownerReferences"
  - name: newLabels
    expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  - name: oldLabels
    expression: "oldObject == null || !has(oldObject.metadata.labels) ? {} : oldObject.metadata.labels"
  - name: newSelector
    expression: "object.kind in ['Pod', 'Binding'] || !has(object.spec.selector) ? null : object.spec.selector"
  - name: oldSelector
    expression: "oldObject == null || oldObject.kind in ['Pod', 'Binding'] || !has(oldObject.spec.selector) ? null : oldObject.spec.selector"
  - name: newFinalizers
    expression: "has(object.metadata.finalizers) ? object.metadata.finalizers : []"
  - name: oldFinalizers
    expression: "oldObject == null || !has(oldObject.metadata.finalizers) ? [] : oldObject.metadata.finalizers"
  - name: exempt
    expression: >-
      request.userInfo.username in variables.controllerUsers ||
      (has(request.userInfo.groups) && request.userInfo.groups.exists(g, g in variables.controllerGroups)) ||
      request.userInfo.username in variables.workloadControllerUsers
  validations:
  # On DELETE there is no new object; only the last validation applies.
  - expression: >-
      request.operation == 'DELETE' || variables.exempt ||
      (variables.newReserved.all(e, e in variables.oldReserved) &&
       variables.oldReserved.all(e, e in variables.newReserved))
    messageExpression: >-
      'labels and annotations with the prefixes breakglass.telekom.com/debug-session and breakglass.telekom.com/ephemeral. are reserved for the breakglass controller; '
      + request.userInfo.username + ' may not set, change or remove them'
    reason: Forbidden
  # Otherwise anyone who may edit a debug pod or workload could swap its image,
  # command or containers (including ephemeral containers) and run their own
  # code under the genuine session markers. Scaling and metadata edits stay
  # allowed.
  - expression: >-
      request.operation == 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      variables.newSpec == variables.oldSpec
    messageExpression: >-
      'the pod spec of a breakglass debug pod or debug workload template is reserved for the breakglass controller; '
      + request.userInfo.username + ' may not change it'
    reason: Forbidden
  - expression: >-
      request.operation == 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      (variables.newOwners == variables.oldOwners && variables.newLabels == variables.oldLabels &&
       variables.newSelector == variables.oldSelector &&
       variables.newFinalizers.all(f, f in variables.oldFinalizers))
    messageExpression: >-
      'the owner references, labels, selector and finalizers of a breakglass debug pod or debug workload are reserved for the breakglass controller; '
      + request.userInfo.username + ' may not change them'
    reason: Forbidden
  # Orphaning deletes leave the marked children running after cleanup. Where
  # the kube-controller-manager shares one identity, its garbage collector is
  # exempt, so this must be refused at the delete itself. Jobs and
  # ReplicationControllers orphan by default, so an explicit cascading policy
  # is required for every kind (kubectl sends Background by default).
  - expression: >-
      request.operation != 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      (request.options != null &&
       has(request.options.propagationPolicy) && request.options.propagationPolicy in ['Background', 'Foreground'] &&
       !(has(request.options.orphanDependents) && request.options.orphanDependents == true))
    messageExpression: >-
      'breakglass debug workloads may only be deleted with propagationPolicy Background or Foreground; ' + request.userInfo.username + ' may not orphan their Pods'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: breakglass-runtime-label-reservation
  labels:
    {{- include "escalation-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  policyName: breakglass-runtime-label-reservation
  validationActions: [Deny]
{{- end }}
