---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: identityproviders.breakglass.t-caas.telekom.com
spec:
  group: breakglass.t-caas.telekom.com
  names:
    kind: IdentityProvider
    listKind: IdentityProviderList
    plural: identityproviders
    singular: identityprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.issuer
      name: Issuer
      type: string
    - jsonPath: .spec.groupSyncProvider
      name: GroupSync
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IdentityProvider represents a configured identity provider with OIDC authentication and optional group synchronization
          IdentityProvider is cluster-scoped, allowing global identity provider configuration.
          All identity providers use OIDC for user authentication. Group synchronization can be optionally
          configured using providers like Keycloak. Multiple IdentityProviders can be configured per cluster.
          The Issuer field must be set to the OIDC issuer URL (matching the 'iss' claim in JWT tokens) to enable
          multi-IDP support. ClusterConfig and BreakglassEscalation can restrict access to specific IDPs by name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IdentityProviderSpec defines the desired state of an IdentityProvider
            properties:
              disabled:
                description: Disabled can be set to true to temporarily disable this
                  provider without deleting it
                type: boolean
              displayName:
                description: DisplayName is a human-readable name for this provider
                  (shown in UI/logs)
                maxLength: 100
                type: string
              groupSyncProvider:
                description: |-
                  GroupSyncProvider specifies which provider to use for group synchronization (optional)
                  If not set, group synchronization is disabled
                enum:
                - Keycloak
                type: string
              issuer:
                description: |-
                  Issuer is the OIDC issuer URL, which must match the 'iss' claim in JWT tokens
                  This uniquely identifies the identity provider and is used to determine which provider
                  authenticated a user based on their JWT token.
                  Example: https://auth.example.com
                maxLength: 253
                pattern: ^https://.+
                type: string
              keycloak:
                description: |-
                  Keycloak holds Keycloak-specific configuration for group synchronization
                  Required when groupSyncProvider is "Keycloak"
                properties:
                  baseURL:
                    description: |-
                      BaseURL is the Keycloak server URL
                      Example: https://keycloak.example.com
                    maxLength: 253
                    minLength: 1
                    pattern: ^https://.+
                    type: string
                  cacheTTL:
                    description: 'CacheTTL is the duration to cache user/group memberships
                      (default: 10m)'
                    pattern: ^((([0-9]+([.][0-9]*)?|[.][0-9]+)(ns|us|µs|μs|ms|s|m|h))+|([0-9]+([.][0-9]+)?(ns|us|µs|ms|s|m|h)|[0-9]+(d|w|y))+)$
                    type: string
                  certificateAuthority:
                    description: CertificateAuthority contains a PEM encoded CA certificate
                      for TLS validation
                    type: string
                  clientID:
                    description: ClientID is the service account client ID for group/user
                      queries (should have view-users/view-groups only)
                    maxLength: 253
                    minLength: 1
                    pattern: ^\S+$
                    type: string
                  clientSecretRef:
                    description: ClientSecretRef references a Secret containing the
                      client secret
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify is not supported for Keycloak group synchronization.
                      Admission and runtime auth/OIDC proxy paths reject this setting; configure
                      certificateAuthority for private or self-signed Keycloak certificates.
                    type: boolean
                  realm:
                    description: Realm is the Keycloak realm name
                    maxLength: 253
                    minLength: 1
                    type: string
                  requestTimeout:
                    description: 'RequestTimeout is the timeout for Keycloak API requests
                      (default: 10s)'
                    pattern: ^((([0-9]+([.][0-9]*)?|[.][0-9]+)(ns|us|µs|μs|ms|s|m|h))+|([0-9]+([.][0-9]+)?(ns|us|µs|ms|s|m|h)|[0-9]+(d|w|y))+)$
                    type: string
                required:
                - baseURL
                - clientID
                - clientSecretRef
                - realm
                type: object
              kubernetesIdentity:
                description: |-
                  kubernetesIdentity configures kube-apiserver structured JWT claim mapping.
                  It cannot be combined with the shorthand userIdentifierClaim or prefix.
                properties:
                  claimMappings:
                    description: claimMappings maps token claims to Kubernetes user
                      attributes.
                    properties:
                      extra:
                        description: |-
                          extra represents an option for the extra attribute.
                          expression must produce a string or string array value.
                          If the value is empty, the extra mapping will not be present.

                          hard-coded extra key/value
                          - key: "foo"
                            valueExpression: "'bar'"
                          This will result in an extra attribute - foo: ["bar"]

                          hard-coded key, value copying claim value
                          - key: "foo"
                            valueExpression: "claims.some_claim"
                          This will result in an extra attribute - foo: [value of some_claim]

                          hard-coded key, value derived from claim value
                          - key: "admin"
                            valueExpression: '(has(claims.is_admin) && claims.is_admin) ? "true":""'
                          This will result in:
                           - if is_admin claim is present and true, extra attribute - admin: ["true"]
                           - if is_admin claim is present and false or is_admin claim is not present, no extra attribute will be added
                        items:
                          description: ExtraMapping provides the configuration for
                            a single extra mapping.
                          properties:
                            key:
                              description: |-
                                key is a string to use as the extra attribute key.
                                key must be a domain-prefix path (e.g. example.org/foo). All characters before the first "/" must be a valid
                                subdomain as defined by RFC 1123. All characters trailing the first "/" must
                                be valid HTTP Path characters as defined by RFC 3986.
                                key must be lowercase.
                                Required to be unique.
                              type: string
                            valueExpression:
                              description: |-
                                valueExpression is a CEL expression to extract extra attribute value.
                                valueExpression must produce a string or string array value.
                                "", [], and null values are treated as the extra mapping not being present.
                                Empty string values contained within a string array are filtered out.

                                CEL expressions have access to the contents of the token claims, organized into CEL variable:
                                - 'claims' is a map of claim names to claim values.
                                  For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                  Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                                Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/
                              type: string
                          required:
                          - key
                          - valueExpression
                          type: object
                        type: array
                      groups:
                        description: |-
                          groups represents an option for the groups attribute.
                          The claim's value must be a string or string array claim.
                          If groups.claim is set, the prefix must be specified (and can be the empty string).
                          If groups.expression is set, the expression must produce a string or string array value.
                           "", [], and null values are treated as the group mapping not being present.
                        properties:
                          claim:
                            description: |-
                              claim is the JWT claim to use.
                              Mutually exclusive with expression.
                            type: string
                          expression:
                            description: |-
                              expression represents the expression which will be evaluated by CEL.

                              CEL expressions have access to the contents of the token claims, organized into CEL variable:
                              - 'claims' is a map of claim names to claim values.
                                For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                              Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                              Mutually exclusive with claim and prefix.
                            type: string
                          prefix:
                            description: |-
                              prefix is prepended to claim's value to prevent clashes with existing names.
                              prefix needs to be set if claim is set and can be the empty string.
                              Mutually exclusive with expression.
                            type: string
                        type: object
                      uid:
                        description: |-
                          uid represents an option for the uid attribute.
                          Claim must be a singular string claim.
                          If uid.expression is set, the expression must produce a string value.
                        properties:
                          claim:
                            description: |-
                              claim is the JWT claim to use.
                              Either claim or expression must be set.
                              Mutually exclusive with expression.
                            type: string
                          expression:
                            description: |-
                              expression represents the expression which will be evaluated by CEL.

                              CEL expressions have access to the contents of the token claims, organized into CEL variable:
                              - 'claims' is a map of claim names to claim values.
                                For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                              Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                              Mutually exclusive with claim.
                            type: string
                        type: object
                      username:
                        description: |-
                          username represents an option for the username attribute.
                          The claim's value must be a singular string.
                          Same as the --oidc-username-claim and --oidc-username-prefix flags.
                          If username.expression is set, the expression must produce a string value.
                          If username.expression uses 'claims.email', then 'claims.email_verified' must be used in
                          username.expression or extra[*].valueExpression or claimValidationRules[*].expression.
                          An example claim validation rule expression that matches the validation automatically
                          applied when username.claim is set to 'email' is 'claims.?email_verified.orValue(true) == true'. By explicitly comparing
                          the value to true, we let type-checking see the result will be a boolean, and to make sure a non-boolean email_verified
                          claim will be caught at runtime.

                          In the flag based approach, the --oidc-username-claim and --oidc-username-prefix are optional. If --oidc-username-claim is not set,
                          the default value is "sub". For the authentication config, there is no defaulting for claim or prefix. The claim and prefix must be set explicitly.
                          For claim, if --oidc-username-claim was not set with legacy flag approach, configure username.claim="sub" in the authentication config.
                          For prefix:
                              (1) --oidc-username-prefix="-", no prefix was added to the username. For the same behavior using authentication config,
                                  set username.prefix=""
                              (2) --oidc-username-prefix="" and  --oidc-username-claim != "email", prefix was "<value of --oidc-issuer-url>#". For the same
                                  behavior using authentication config, set username.prefix="<value of issuer.url>#"
                              (3) --oidc-username-prefix="<value>". For the same behavior using authentication config, set username.prefix="<value>"
                        properties:
                          claim:
                            description: |-
                              claim is the JWT claim to use.
                              Mutually exclusive with expression.
                            type: string
                          expression:
                            description: |-
                              expression represents the expression which will be evaluated by CEL.

                              CEL expressions have access to the contents of the token claims, organized into CEL variable:
                              - 'claims' is a map of claim names to claim values.
                                For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                              Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                              Mutually exclusive with claim and prefix.
                            type: string
                          prefix:
                            description: |-
                              prefix is prepended to claim's value to prevent clashes with existing names.
                              prefix needs to be set if claim is set and can be the empty string.
                              Mutually exclusive with expression.
                            type: string
                        type: object
                    required:
                    - username
                    type: object
                  claimValidationRules:
                    description: claimValidationRules validate claims before the identity
                      is constructed.
                    items:
                      description: ClaimValidationRule provides the configuration
                        for a single claim validation rule.
                      properties:
                        claim:
                          description: |-
                            claim is the name of a required claim.
                            Same as --oidc-required-claim flag.
                            Only string claim keys are supported.
                            Mutually exclusive with expression and message.
                          type: string
                        expression:
                          description: |-
                            expression represents the expression which will be evaluated by CEL.
                            Must produce a boolean.

                            CEL expressions have access to the contents of the token claims, organized into CEL variable:
                            - 'claims' is a map of claim names to claim values.
                              For example, a variable named 'sub' can be accessed as 'claims.sub'.
                              Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.
                            Must return true for the validation to pass.

                            Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                            Mutually exclusive with claim and requiredValue.
                          type: string
                        message:
                          description: |-
                            message customizes the returned error message when expression returns false.
                            message is a literal string.
                            Mutually exclusive with claim and requiredValue.
                          type: string
                        requiredValue:
                          description: |-
                            requiredValue is the value of a required claim.
                            Same as --oidc-required-claim flag.
                            Only string claim values are supported.
                            If claim is set and requiredValue is not set, the claim must be present with a value set to the empty string.
                            Mutually exclusive with expression and message.
                          type: string
                      type: object
                    type: array
                  userValidationRules:
                    description: userValidationRules validate the final Kubernetes
                      user info.
                    items:
                      description: UserValidationRule provides the configuration for
                        a single user info validation rule.
                      properties:
                        expression:
                          description: |-
                            expression represents the expression which will be evaluated by CEL.
                            Must return true for the validation to pass.

                            CEL expressions have access to the contents of UserInfo, organized into CEL variable:
                            - 'user' - authentication.k8s.io/v1, Kind=UserInfo object
                               Refer to https://github.com/kubernetes/api/blob/release-1.28/authentication/v1/types.go#L105-L122 for the definition.
                               API documentation: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.28/#userinfo-v1-authentication-k8s-io

                            Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/
                          type: string
                        message:
                          description: |-
                            message customizes the returned error message when rule returns false.
                            message is a literal string.
                          type: string
                      required:
                      - expression
                      type: object
                    type: array
                required:
                - claimMappings
                type: object
              oidc:
                description: |-
                  OIDC holds mandatory OIDC configuration for user authentication
                  This is the base authentication mechanism for all identity providers
                properties:
                  audiences:
                    description: |-
                      Audiences contains additional accepted JWT audiences. ExpectedAudience is
                      always retained for compatibility and is included in the effective set.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  authority:
                    description: |-
                      Authority is the OIDC provider authority endpoint
                      Example: https://auth.example.com
                    maxLength: 253
                    minLength: 1
                    pattern: ^https://.+
                    type: string
                  certificateAuthority:
                    description: CertificateAuthority contains a PEM encoded CA certificate
                      for TLS validation
                    type: string
                  clientID:
                    description: ClientID is the OIDC client ID for user authentication
                      (frontend/UI)
                    maxLength: 253
                    minLength: 1
                    pattern: ^\S+$
                    type: string
                  discoveryURL:
                    description: DiscoveryURL overrides the issuer's .well-known discovery
                      endpoint.
                    maxLength: 2048
                    pattern: ^https://.+
                    type: string
                  expectedAudience:
                    description: |-
                      ExpectedAudience is the required JWT audience (aud) claim value.
                      The API server validates that incoming JWTs contain this value in their
                      aud claim. This prevents cross-service token confusion from other OIDC
                      clients at the same identity provider.
                      Requires a matching audience protocol mapper in the identity provider
                      that adds this value to the aud claim in issued tokens.
                    minLength: 1
                    type: string
                  insecureSkipVerify:
                    description: |-
                      InsecureSkipVerify is deprecated for IdentityProvider OIDC/JWKS authentication.
                      Admission and runtime auth/OIDC proxy paths reject this setting; configure
                      certificateAuthority for private or self-signed issuer certificates.
                    type: boolean
                  jwksEndpoint:
                    description: |-
                      JWKSEndpoint is the endpoint for fetching JSON Web Key Sets
                      If empty, defaults to Authority/.well-known/openid-configuration
                    maxLength: 253
                    pattern: ^https://.+
                    type: string
                  supportedSigningAlgs:
                    description: |-
                      SupportedSigningAlgs limits accepted JWT signing algorithms. An empty list
                      uses the API server's default allowlist.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                required:
                - authority
                - clientID
                - expectedAudience
                type: object
              primary:
                description: |-
                  Primary indicates if this is the primary identity provider (used by default)
                  Deprecated: Primary is kept for backward compatibility. In multi-IDP mode,
                  use ClusterConfig.IdentityProviderRefs instead. Removal target: v1beta1.
                type: boolean
              sessionLimits:
                description: |-
                  sessionLimits defines default session limits for users from this IdentityProvider.
                  Individual escalations can override these limits via sessionLimitsOverride.
                properties:
                  groupOverrides:
                    description: |-
                      groupOverrides allows different limits for specific groups from this IDP.
                      For example, platform teams can have higher limits than tenant teams.
                      Overrides are evaluated in order; first matching group wins.
                    items:
                      description: SessionLimitGroupOverride defines session limit
                        overrides for a specific group.
                      properties:
                        group:
                          description: |-
                            group is a glob pattern used to match group names (e.g., "platform-*").
                            Supports wildcards: "*" matches any sequence, "?" matches single char, "[...]" for char classes.
                            Matching is case-sensitive; the first matching override wins.
                          minLength: 1
                          type: string
                        maxActiveSessionsPerUser:
                          description: |-
                            maxActiveSessionsPerUser overrides the default limit for this group.
                            Only used if unlimited is false.
                          format: int32
                          minimum: 1
                          type: integer
                        unlimited:
                          description: |-
                            unlimited disables session limits entirely for users in this group.
                            When true, maxActiveSessionsPerUser is ignored.
                          type: boolean
                      required:
                      - group
                      type: object
                    type: array
                  maxActiveSessionsPerUser:
                    description: |-
                      maxActiveSessionsPerUser is the default maximum concurrent active sessions per user.
                      Active sessions are those in Pending or Approved state.
                      If not set, no limit is enforced by default.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              userIdentifierClaim:
                description: |-
                  userIdentifierClaim is the provider default used when no cluster override
                  is configured. It is an arbitrary JWT claim name, matching kube-apiserver.
                type: string
              userIdentifierPrefix:
                description: |-
                  userIdentifierPrefix is prepended literally to the selected user identifier claim.
                  Include any separator (for example "tdi_security_oidc:"); empty means no prefix.
                type: string
            required:
            - oidc
            type: object
          status:
            description: IdentityProviderStatus defines the observed state of an IdentityProvider
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the IdentityProvider's state.
                  All status information is conveyed through conditions:
                  - Ready: Configuration is valid and provider is operational
                  - ConversionFailed: Configuration conversion failed
                  - ValidationFailed: Configuration validation failed
                  - GroupSyncHealthy: Group sync provider is healthy and reachable
                  - CacheUpdated: Provider cache has been successfully updated
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed IdentityProvider
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
