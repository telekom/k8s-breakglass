---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterconfigs.breakglass.t-caas.telekom.com
spec:
  group: breakglass.t-caas.telekom.com
  names:
    kind: ClusterConfig
    listKind: ClusterConfigList
    plural: clusterconfigs
    shortNames:
    - ccfg
    singular: clusterconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .spec.clusterID
      name: ClusterID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterConfig is the Schema for the clusterconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterConfigSpec defines metadata and secret reference for a managed tenant cluster.
              This enables the hub (breakglass) instance to perform authorization checks (SAR) on the target cluster.
            properties:
              allowedApproverDomains:
                description: |-
                  allowedApproverDomains restricts approvers to users whose email matches one of the listed domains (e.g. ["example.com", "example.org"])
                  If set, an approver must have an email address ending with one of these domains.
                items:
                  type: string
                type: array
              authType:
                default: Kubeconfig
                description: |-
                  authType specifies the authentication method for connecting to the target cluster.
                  Defaults to "Kubeconfig" if kubeconfigSecretRef is specified, "OIDC" if oidcAuth is specified.
                enum:
                - Kubeconfig
                - OIDC
                type: string
              blockSelfApproval:
                description: blockSelfApproval, if true, prevents users from self-approving
                  their own breakglass sessions for this cluster.
                type: boolean
              burst:
                description: burst configures the client burst against the target
                  cluster.
                format: int32
                minimum: 1
                type: integer
              clusterID:
                description: clusterID is the canonical identifier of the cluster.
                  Defaults to metadata.name if empty.
                maxLength: 253
                type: string
              constrainedImpersonation:
                description: |-
                  constrainedImpersonation declares whether this spoke supports Kubernetes
                  constrained impersonation (KEP-5284) and how breakglass should behave when it
                  does not. Optional; the default is capability autodetection with a legacy
                  fallback, which is the behaviour of releases before this field existed.
                properties:
                  denyUnrecognisedVerbs:
                    default: true
                    description: |-
                      denyUnrecognisedVerbs controls whether the breakglass authorization webhook
                      denies impersonation verbs it cannot parse.

                      Leave this enabled. A webhook authorizer that allows unknown verbs silently
                      grants constrained impersonation on any cluster with the gate on, because the
                      API server asks about `impersonate:<mode>` verbs the webhook has never heard
                      of. Disabling it is only sensible while debugging a newer API server against
                      an older breakglass.
                    type: boolean
                  legacyFallback:
                    default: Allow
                    description: |-
                      legacyFallback controls whether breakglass tolerates the API server falling
                      back to legacy unconstrained impersonation when every constrained mode
                      denies.

                      This matters more than it looks. A blanket `impersonate` grant on core
                      users/groups with no resourceNames wins by fallback and silently defeats
                      every constraint expressed elsewhere, and the API server does NOT apply the
                      constrained restrictions (system:masters, group and extra validation) to the
                      legacy path.
                    enum:
                    - Allow
                    - Warn
                    - Forbidden
                    type: string
                  probeMode:
                    default: user-info
                    description: |-
                      probeMode is the constrained mode breakglass uses for its own RBAC probe,
                      which impersonates a synthetic user to test what a session's groups could do.
                      Defaults to "user-info", the only mode that can carry groups.
                    enum:
                    - user-info
                    - serviceaccount
                    - arbitrary-node
                    - associated-node
                    - legacy
                    type: string
                  support:
                    default: Auto
                    description: support declares whether the spoke supports constrained
                      impersonation.
                    enum:
                    - Auto
                    - Enabled
                    - Disabled
                    type: string
                type: object
              environment:
                description: environment (e.g. dev, staging, prod) override.
                maxLength: 253
                type: string
              identityProviderRefs:
                description: |-
                  identityProviderRefs specifies which IdentityProvider CRs are allowed to authenticate for this cluster.
                  If empty or unset, all enabled IdentityProviders are accepted (backward compatible default).
                  If set, users must authenticate via one of the named providers.
                  Names should match the metadata.name of IdentityProvider resources.
                items:
                  type: string
                type: array
              kubeconfigSecretRef:
                description: |-
                  kubeconfigSecretRef references a secret containing an admin-level kubeconfig for the target cluster.
                  Required when authType is "Kubeconfig". The referenced Secret MUST exist in the specified namespace and contain the key (default: "value", compatible with cluster-api).
                properties:
                  key:
                    description: Key is the data key in the secret (defaults to "value"
                      if not specified)
                    type: string
                  name:
                    description: Name is the name of the secret
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the namespace containing the secret
                      (supports cross-namespace references)
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              kubernetesIdentity:
                description: |-
                  kubernetesIdentity configures kube-apiserver structured JWT claim mapping.
                  It cannot be combined with the shorthand userIdentifierClaim or prefix.
                properties:
                  claimMappings:
                    description: claimMappings maps token claims to Kubernetes user
                      attributes.
                    properties:
                      extra:
                        description: |-
                          extra represents an option for the extra attribute.
                          expression must produce a string or string array value.
                          If the value is empty, the extra mapping will not be present.

                          hard-coded extra key/value
                          - key: "foo"
                            valueExpression: "'bar'"
                          This will result in an extra attribute - foo: ["bar"]

                          hard-coded key, value copying claim value
                          - key: "foo"
                            valueExpression: "claims.some_claim"
                          This will result in an extra attribute - foo: [value of some_claim]

                          hard-coded key, value derived from claim value
                          - key: "admin"
                            valueExpression: '(has(claims.is_admin) && claims.is_admin) ? "true":""'
                          This will result in:
                           - if is_admin claim is present and true, extra attribute - admin: ["true"]
                           - if is_admin claim is present and false or is_admin claim is not present, no extra attribute will be added
                        items:
                          description: ExtraMapping provides the configuration for
                            a single extra mapping.
                          properties:
                            key:
                              description: |-
                                key is a string to use as the extra attribute key.
                                key must be a domain-prefix path (e.g. example.org/foo). All characters before the first "/" must be a valid
                                subdomain as defined by RFC 1123. All characters trailing the first "/" must
                                be valid HTTP Path characters as defined by RFC 3986.
                                key must be lowercase.
                                Required to be unique.
                              type: string
                            valueExpression:
                              description: |-
                                valueExpression is a CEL expression to extract extra attribute value.
                                valueExpression must produce a string or string array value.
                                "", [], and null values are treated as the extra mapping not being present.
                                Empty string values contained within a string array are filtered out.

                                CEL expressions have access to the contents of the token claims, organized into CEL variable:
                                - 'claims' is a map of claim names to claim values.
                                  For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                  Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                                Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/
                              type: string
                          required:
                          - key
                          - valueExpression
                          type: object
                        type: array
                      groups:
                        description: |-
                          groups represents an option for the groups attribute.
                          The claim's value must be a string or string array claim.
                          If groups.claim is set, the prefix must be specified (and can be the empty string).
                          If groups.expression is set, the expression must produce a string or string array value.
                           "", [], and null values are treated as the group mapping not being present.
                        properties:
                          claim:
                            description: |-
                              claim is the JWT claim to use.
                              Mutually exclusive with expression.
                            type: string
                          expression:
                            description: |-
                              expression represents the expression which will be evaluated by CEL.

                              CEL expressions have access to the contents of the token claims, organized into CEL variable:
                              - 'claims' is a map of claim names to claim values.
                                For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                              Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                              Mutually exclusive with claim and prefix.
                            type: string
                          prefix:
                            description: |-
                              prefix is prepended to claim's value to prevent clashes with existing names.
                              prefix needs to be set if claim is set and can be the empty string.
                              Mutually exclusive with expression.
                            type: string
                        type: object
                      uid:
                        description: |-
                          uid represents an option for the uid attribute.
                          Claim must be a singular string claim.
                          If uid.expression is set, the expression must produce a string value.
                        properties:
                          claim:
                            description: |-
                              claim is the JWT claim to use.
                              Either claim or expression must be set.
                              Mutually exclusive with expression.
                            type: string
                          expression:
                            description: |-
                              expression represents the expression which will be evaluated by CEL.

                              CEL expressions have access to the contents of the token claims, organized into CEL variable:
                              - 'claims' is a map of claim names to claim values.
                                For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                              Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                              Mutually exclusive with claim.
                            type: string
                        type: object
                      username:
                        description: |-
                          username represents an option for the username attribute.
                          The claim's value must be a singular string.
                          Same as the --oidc-username-claim and --oidc-username-prefix flags.
                          If username.expression is set, the expression must produce a string value.
                          If username.expression uses 'claims.email', then 'claims.email_verified' must be used in
                          username.expression or extra[*].valueExpression or claimValidationRules[*].expression.
                          An example claim validation rule expression that matches the validation automatically
                          applied when username.claim is set to 'email' is 'claims.?email_verified.orValue(true) == true'. By explicitly comparing
                          the value to true, we let type-checking see the result will be a boolean, and to make sure a non-boolean email_verified
                          claim will be caught at runtime.

                          In the flag based approach, the --oidc-username-claim and --oidc-username-prefix are optional. If --oidc-username-claim is not set,
                          the default value is "sub". For the authentication config, there is no defaulting for claim or prefix. The claim and prefix must be set explicitly.
                          For claim, if --oidc-username-claim was not set with legacy flag approach, configure username.claim="sub" in the authentication config.
                          For prefix:
                              (1) --oidc-username-prefix="-", no prefix was added to the username. For the same behavior using authentication config,
                                  set username.prefix=""
                              (2) --oidc-username-prefix="" and  --oidc-username-claim != "email", prefix was "<value of --oidc-issuer-url>#". For the same
                                  behavior using authentication config, set username.prefix="<value of issuer.url>#"
                              (3) --oidc-username-prefix="<value>". For the same behavior using authentication config, set username.prefix="<value>"
                        properties:
                          claim:
                            description: |-
                              claim is the JWT claim to use.
                              Mutually exclusive with expression.
                            type: string
                          expression:
                            description: |-
                              expression represents the expression which will be evaluated by CEL.

                              CEL expressions have access to the contents of the token claims, organized into CEL variable:
                              - 'claims' is a map of claim names to claim values.
                                For example, a variable named 'sub' can be accessed as 'claims.sub'.
                                Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.

                              Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                              Mutually exclusive with claim and prefix.
                            type: string
                          prefix:
                            description: |-
                              prefix is prepended to claim's value to prevent clashes with existing names.
                              prefix needs to be set if claim is set and can be the empty string.
                              Mutually exclusive with expression.
                            type: string
                        type: object
                    required:
                    - username
                    type: object
                  claimValidationRules:
                    description: claimValidationRules validate claims before the identity
                      is constructed.
                    items:
                      description: ClaimValidationRule provides the configuration
                        for a single claim validation rule.
                      properties:
                        claim:
                          description: |-
                            claim is the name of a required claim.
                            Same as --oidc-required-claim flag.
                            Only string claim keys are supported.
                            Mutually exclusive with expression and message.
                          type: string
                        expression:
                          description: |-
                            expression represents the expression which will be evaluated by CEL.
                            Must produce a boolean.

                            CEL expressions have access to the contents of the token claims, organized into CEL variable:
                            - 'claims' is a map of claim names to claim values.
                              For example, a variable named 'sub' can be accessed as 'claims.sub'.
                              Nested claims can be accessed using dot notation, e.g. 'claims.foo.bar'.
                            Must return true for the validation to pass.

                            Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/

                            Mutually exclusive with claim and requiredValue.
                          type: string
                        message:
                          description: |-
                            message customizes the returned error message when expression returns false.
                            message is a literal string.
                            Mutually exclusive with claim and requiredValue.
                          type: string
                        requiredValue:
                          description: |-
                            requiredValue is the value of a required claim.
                            Same as --oidc-required-claim flag.
                            Only string claim values are supported.
                            If claim is set and requiredValue is not set, the claim must be present with a value set to the empty string.
                            Mutually exclusive with expression and message.
                          type: string
                      type: object
                    type: array
                  userValidationRules:
                    description: userValidationRules validate the final Kubernetes
                      user info.
                    items:
                      description: UserValidationRule provides the configuration for
                        a single user info validation rule.
                      properties:
                        expression:
                          description: |-
                            expression represents the expression which will be evaluated by CEL.
                            Must return true for the validation to pass.

                            CEL expressions have access to the contents of UserInfo, organized into CEL variable:
                            - 'user' - authentication.k8s.io/v1, Kind=UserInfo object
                               Refer to https://github.com/kubernetes/api/blob/release-1.28/authentication/v1/types.go#L105-L122 for the definition.
                               API documentation: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.28/#userinfo-v1-authentication-k8s-io

                            Documentation on CEL: https://kubernetes.io/docs/reference/using-api/cel/
                          type: string
                        message:
                          description: |-
                            message customizes the returned error message when rule returns false.
                            message is a literal string.
                          type: string
                      required:
                      - expression
                      type: object
                    type: array
                required:
                - claimMappings
                type: object
              location:
                description: location / region override.
                maxLength: 253
                type: string
              mailProvider:
                description: |-
                  mailProvider specifies which MailProvider to use for email notifications for this cluster.
                  If empty, falls back to the default MailProvider.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              oidcAuth:
                description: |-
                  oidcAuth configures OIDC-based authentication for the target cluster.
                  Required when authType is "OIDC" (unless oidcFromIdentityProvider is set).
                  Supports client credentials and token exchange flows.
                properties:
                  allowTOFU:
                    description: |-
                      allowTOFU enables Trust On First Use (TOFU) for cluster or issuer CAs when no CA is provided.
                      When false (default), the controller relies on system trust or explicit CA configuration.
                    type: boolean
                  audience:
                    description: |-
                      audience specifies the intended audience for the token (typically the cluster's API server).
                      If empty, defaults to the target server URL.
                    type: string
                  caSecretRef:
                    description: |-
                      caSecretRef references a secret containing the CA certificate for the target cluster.
                      The CA is used to verify the target server's TLS certificate.
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  certificateAuthority:
                    description: certificateAuthority contains a PEM-encoded CA certificate
                      for validating the OIDC issuer's TLS cert.
                    type: string
                  clientID:
                    description: clientID is the OIDC client ID for authenticating
                      the breakglass controller.
                    minLength: 1
                    type: string
                  clientSecretRef:
                    description: |-
                      clientSecretRef references a secret containing the OIDC client secret.
                      Required for client credentials flow.
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  fallbackPolicy:
                    default: None
                    description: |-
                      fallbackPolicy controls behavior when the primary auth flow (refresh token) fails.
                      Only valid when refreshTokenSecretRef is set.
                      - None (default): hard fail, set RefreshTokenExpired condition, no fallback.
                      - Auto: silently fall back to client_credentials flow (requires clientSecretRef or IDP Keycloak SA).
                      - Warn: fall back but also set DegradedAuth condition and emit K8s event.
                    enum:
                    - None
                    - Auto
                    - Warn
                    type: string
                  insecureSkipTLSVerify:
                    description: insecureSkipTLSVerify skips TLS verification for
                      the target cluster (NOT recommended for production).
                    type: boolean
                  issuerURL:
                    description: |-
                      issuerURL is the OIDC issuer URL (e.g., https://keycloak.example.com/realms/myrealm).
                      Must match the issuer configured on the target cluster's API server.
                    minLength: 1
                    pattern: ^https://.+
                    type: string
                  refreshTokenSecretRef:
                    description: |-
                      refreshTokenSecretRef references a secret containing an offline refresh token.
                      When set, the controller uses the refresh token to obtain access tokens
                      instead of client_credentials flow. This allows reusing an existing OIDC client
                      without registering a new one for each cluster.
                      Mutually exclusive with clientSecretRef on OIDCFromIdentityProviderConfig,
                      but can coexist with clientSecretRef on OIDCAuthConfig (enables explicit fallback).
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  rotatedRefreshTokenKey:
                    description: |-
                      rotatedRefreshTokenKey specifies an additional key in the same secret referenced by
                      refreshTokenSecretRef where the controller writes rotated refresh tokens received
                      from the OIDC provider. The original key is never modified, making this safe for
                      GitOps tools (e.g. Flux) that manage the seed token.
                      When reading, the controller checks the rotated key first and falls back to the
                      original key — ensuring the freshest token is always used.
                      Opt-in: if empty, refresh token rotation is not persisted (tokens are cached in-memory only).
                      Must differ from the key in refreshTokenSecretRef.
                    maxLength: 253
                    type: string
                  scopes:
                    description: |-
                      scopes specifies additional OIDC scopes to request.
                      Default scopes (openid, email, groups) are always included.
                    items:
                      type: string
                    type: array
                  server:
                    description: |-
                      server is the URL of the target cluster's Kubernetes API server.
                      Required when using OIDC auth to know where to send authenticated requests.
                    minLength: 1
                    pattern: ^https://.+
                    type: string
                  tokenExchange:
                    description: |-
                      tokenExchange enables token exchange flow instead of client credentials.
                      When enabled, the controller exchanges the user's token for a cluster-scoped token.
                    properties:
                      actorTokenSecretRef:
                        description: |-
                          actorTokenSecretRef optionally references a secret containing an actor token.
                          This is used in delegation scenarios where the actor (controller) is acting
                          on behalf of the subject (user/service).
                        properties:
                          key:
                            description: Key is the data key in the secret (defaults
                              to "value" if not specified)
                            type: string
                          name:
                            description: Name is the name of the secret
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace is the namespace containing the
                              secret (supports cross-namespace references)
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      actorTokenType:
                        description: |-
                          actorTokenType specifies the type of the actor token.
                          Default: urn:ietf:params:oauth:token-type:access_token
                        type: string
                      enabled:
                        description: enabled activates token exchange flow.
                        type: boolean
                      requestedTokenType:
                        description: |-
                          requestedTokenType specifies the type of token to request.
                          Default: urn:ietf:params:oauth:token-type:access_token
                        type: string
                      resource:
                        description: |-
                          resource specifies the target resource for the exchanged token.
                          This typically identifies the target API server or service.
                        type: string
                      subjectTokenSecretRef:
                        description: |-
                          subjectTokenSecretRef references a secret containing the subject token to exchange.
                          This is required when enabled=true. The controller reads this token and exchanges
                          it for a cluster-scoped token using RFC 8693 token exchange.
                        properties:
                          key:
                            description: Key is the data key in the secret (defaults
                              to "value" if not specified)
                            type: string
                          name:
                            description: Name is the name of the secret
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace is the namespace containing the
                              secret (supports cross-namespace references)
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      subjectTokenType:
                        description: |-
                          subjectTokenType specifies the type of the subject token being exchanged.
                          Default: urn:ietf:params:oauth:token-type:access_token
                        type: string
                    type: object
                required:
                - clientID
                - issuerURL
                - server
                type: object
              oidcFromIdentityProvider:
                description: |-
                  oidcFromIdentityProvider references an IdentityProvider to inherit OIDC configuration from.
                  When set, the cluster uses the referenced IdentityProvider's OIDC issuer URL and settings.
                  You must still provide clusterAPIServer and optionally clientSecretRef for controller authentication.
                  This is useful when the same OIDC provider is used for both user auth and cluster auth.
                  Mutually exclusive with oidcAuth.issuerURL - if both are set, oidcAuth.issuerURL takes precedence.
                properties:
                  allowTOFU:
                    description: |-
                      allowTOFU enables Trust On First Use (TOFU) for cluster CAs when no CA is provided.
                      When false (default), the controller relies on system trust or explicit CA configuration.
                    type: boolean
                  audience:
                    description: |-
                      audience specifies the intended audience for the token (typically the cluster's API server).
                      If empty, defaults to the target server URL.
                    type: string
                  caSecretRef:
                    description: caSecretRef references a secret containing the CA
                      certificate for the target cluster.
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  clientID:
                    description: |-
                      clientID overrides the client ID from the IdentityProvider.
                      Use this when the controller needs a different client (service account) than the UI.
                      If empty, uses the IdentityProvider's clientID.
                    type: string
                  clientSecretRef:
                    description: |-
                      clientSecretRef references a secret containing the client secret for the controller.
                      Required for client credentials flow when using a service account client.
                      Mutually exclusive with refreshTokenSecretRef.
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  fallbackPolicy:
                    default: None
                    description: |-
                      fallbackPolicy controls behavior when the primary auth flow (refresh token) fails.
                      Only valid when refreshTokenSecretRef is set.
                      - None (default): hard fail, set RefreshTokenExpired condition, no fallback.
                      - Auto: silently fall back to IDP's Keycloak service account client_credentials flow.
                      - Warn: fall back but also set DegradedAuth condition and emit K8s event.
                    enum:
                    - None
                    - Auto
                    - Warn
                    type: string
                  insecureSkipTLSVerify:
                    description: insecureSkipTLSVerify skips TLS verification for
                      the target cluster (NOT recommended for production).
                    type: boolean
                  name:
                    description: |-
                      name is the name of the IdentityProvider resource to inherit OIDC settings from.
                      The IdentityProvider must exist and be enabled.
                    minLength: 1
                    type: string
                  refreshTokenSecretRef:
                    description: |-
                      refreshTokenSecretRef references a secret containing an offline refresh token.
                      When set, the controller uses the refresh token to obtain access tokens
                      using the IDP's existing client — no new OIDC client registration is needed.
                      Mutually exclusive with clientSecretRef.
                    properties:
                      key:
                        description: Key is the data key in the secret (defaults to
                          "value" if not specified)
                        type: string
                      name:
                        description: Name is the name of the secret
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the namespace containing the secret
                          (supports cross-namespace references)
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  rotatedRefreshTokenKey:
                    description: |-
                      rotatedRefreshTokenKey specifies an additional key in the same secret referenced by
                      refreshTokenSecretRef where the controller writes rotated refresh tokens received
                      from the OIDC provider. The original key is never modified, making this safe for
                      GitOps tools (e.g. Flux) that manage the seed token.
                      When reading, the controller checks the rotated key first and falls back to the
                      original key — ensuring the freshest token is always used.
                      Opt-in: if empty, refresh token rotation is not persisted (tokens are cached in-memory only).
                      Must differ from the key in refreshTokenSecretRef.
                    maxLength: 253
                    type: string
                  scopes:
                    description: |-
                      scopes specifies additional OIDC scopes to request.
                      Default scopes (openid, email, groups) are always included.
                    items:
                      type: string
                    type: array
                  server:
                    description: |-
                      server is the URL of the target cluster's Kubernetes API server.
                      Required - this is cluster-specific and cannot be inherited from IdentityProvider.
                    minLength: 1
                    pattern: ^https://.+
                    type: string
                  tokenExchange:
                    description: |-
                      tokenExchange enables RFC 8693 token exchange flow via the referenced IdentityProvider.
                      When enabled, the controller uses the IDP's Keycloak service account credentials
                      (unless clientSecretRef is explicitly provided) to exchange a subject token
                      for a cluster-scoped access token.
                    properties:
                      actorTokenSecretRef:
                        description: |-
                          actorTokenSecretRef optionally references a secret containing an actor token.
                          This is used in delegation scenarios where the actor (controller) is acting
                          on behalf of the subject (user/service).
                        properties:
                          key:
                            description: Key is the data key in the secret (defaults
                              to "value" if not specified)
                            type: string
                          name:
                            description: Name is the name of the secret
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace is the namespace containing the
                              secret (supports cross-namespace references)
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      actorTokenType:
                        description: |-
                          actorTokenType specifies the type of the actor token.
                          Default: urn:ietf:params:oauth:token-type:access_token
                        type: string
                      enabled:
                        description: enabled activates token exchange flow.
                        type: boolean
                      requestedTokenType:
                        description: |-
                          requestedTokenType specifies the type of token to request.
                          Default: urn:ietf:params:oauth:token-type:access_token
                        type: string
                      resource:
                        description: |-
                          resource specifies the target resource for the exchanged token.
                          This typically identifies the target API server or service.
                        type: string
                      subjectTokenSecretRef:
                        description: |-
                          subjectTokenSecretRef references a secret containing the subject token to exchange.
                          This is required when enabled=true. The controller reads this token and exchanges
                          it for a cluster-scoped token using RFC 8693 token exchange.
                        properties:
                          key:
                            description: Key is the data key in the secret (defaults
                              to "value" if not specified)
                            type: string
                          name:
                            description: Name is the name of the secret
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace is the namespace containing the
                              secret (supports cross-namespace references)
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      subjectTokenType:
                        description: |-
                          subjectTokenType specifies the type of the subject token being exchanged.
                          Default: urn:ietf:params:oauth:token-type:access_token
                        type: string
                    type: object
                required:
                - name
                - server
                type: object
              qps:
                description: qps configures the client QPS against the target cluster.
                format: int32
                minimum: 1
                type: integer
              site:
                description: site override.
                maxLength: 253
                type: string
              tenant:
                description: tenant override; if omitted tenant can be parsed from
                  the clusterID.
                maxLength: 253
                type: string
              userIdentifierClaim:
                description: |-
                  userIdentifierClaim specifies which OIDC claim is used to identify users on this cluster.
                  This MUST match the `claimMappings.username.claim` configured on the target cluster's
                  Kubernetes API server OIDC configuration.
                  Common values: "email" (recommended), "preferred_username", "sub"
                  If not set, inherits the IdentityProvider mapping, then global config kubernetes.userIdentifierClaim.
                type: string
              userIdentifierPrefix:
                description: |-
                  userIdentifierPrefix overrides the authenticated IdentityProvider prefix for this cluster.
                  Omit to inherit; an explicit empty string disables the provider prefix.
                  The value is prepended literally, including any separator, to the selected claim.
                type: string
            type: object
          status:
            description: ClusterConfigStatus captures readiness of the cluster configuration.
            properties:
              conditions:
                description: |-
                  Conditions track ClusterConfig state (kubeconfig validation, connection status, etc.)
                  All status information is conveyed through conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed ClusterConfig
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
