# Reserves the debug-session pod labels and annotations for the breakglass
# controller. Runtime-security tools (Falco exceptions, Tetragon policies,
# session recording) key on these keys, so a pod that could set them itself
# would pass as a debug session.
#
# A request is denied when it adds, changes or removes a label or annotation
# whose key starts with `breakglass.telekom.com/debug-session` or
# `breakglass.telekom.com/ephemeral.` on
#   - a Pod (create, update, status and ephemeral-container updates, and the
#     Binding whose annotations the API server copies onto the Pod), or
#   - the pod template of a workload that the kube-controller-manager turns
#     into Pods (Deployment, ReplicaSet, StatefulSet, DaemonSet, Job, CronJob,
#     ReplicationController), including the template a ControllerRevision
#     stores for StatefulSet and DaemonSet history,
# unless the requesting user is listed in `controllerUsers` (the identity the
# breakglass controller uses on this cluster) or `workloadControllerUsers`
# (the kube-controller-manager identities that copy a template into Pods, and
# its garbage collector and namespace controller, which only delete).
# Exempting the kube-controller-manager is safe only because the templates
# it copies are reserved as well.
#
# On a Pod or workload that carries reserved keys, the same users may also not
# change the pod spec (image, command, containers, ephemeral containers), the
# owner references, the labels or the selector, nor add finalizers, so nobody
# can change what a marked Pod runs through the API objects, or detach or
# hold a marked workload so that it outlives the session. They may delete such a
# workload only with propagationPolicy Background (the kubectl default) or
# Foreground; deletes without a policy or with Orphan are denied, because Jobs
# and ReplicationControllers orphan their Pods by default. They may not delete
# a marked ControllerRevision at all. Other requests are
# allowed, so kubelet status updates, scaling and annotation edits keep
# working.
#
# Not covered: `pods/exec`, `pods/attach` and `pods/portforward` are CONNECT
# requests, and admission policies cannot see the target Pod's labels on
# CONNECT. Anyone whose RBAC allows exec into a marked Pod can still run
# commands there that are attributed to the session. Run debug Pods in
# dedicated namespaces where no other identity holds those permissions; see
# docs/security-best-practices.md#reserved-debug-session-labels.
#
# Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy GA).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: breakglass-runtime-label-reservation
  labels:
    app.kubernetes.io/name: breakglass
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/status", "pods/ephemeralcontainers", "pods/binding", "bindings"]
    # DELETE: an orphaning delete would detach the workload's marked children.
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["replicationcontrollers", "replicationcontrollers/status"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["deployments", "deployments/status", "replicasets", "replicasets/status",
                  "statefulsets", "statefulsets/status", "daemonsets", "daemonsets/status"]
    # StatefulSets create Pods from the template stored in a ControllerRevision.
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["controllerrevisions"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["jobs", "jobs/status", "cronjobs", "cronjobs/status"]
  variables:
  # Keep controllerUsers at index 0 and controllerGroups at index 1: overlays
  # replace them by index. The lists are JSON arrays, which are also valid CEL
  # list literals. List every identity the controller writes debug pods as on
  # this cluster: its ServiceAccount, the user of the hub's ClusterConfig
  # credentials (for OIDC credentials, the username after claim mapping and
  # prefix, e.g. "oidc:breakglass@example.com"), and any ServiceAccount that
  # templates impersonate through spec.impersonation.
  - name: controllerUsers
    expression: '["system:serviceaccount:breakglass-system:breakglass-manager"]'
  # A request from a member of any of these groups counts as the controller.
  - name: controllerGroups
    expression: '[]'
  - name: workloadControllerUsers
    expression: >-
      ["system:kube-controller-manager",
       "system:serviceaccount:kube-system:deployment-controller",
       "system:serviceaccount:kube-system:replicaset-controller",
       "system:serviceaccount:kube-system:replication-controller",
       "system:serviceaccount:kube-system:statefulset-controller",
       "system:serviceaccount:kube-system:daemon-set-controller",
       "system:serviceaccount:kube-system:job-controller",
       "system:serviceaccount:kube-system:cronjob-controller",
       "system:serviceaccount:kube-system:generic-garbage-collector",
       "system:serviceaccount:kube-system:namespace-controller"]
  # Metadata of the Pod, or of the pod template a workload creates Pods from.
  - name: newMeta
    expression: >-
      object.kind in ['Pod', 'Binding'] ? object.metadata :
      object.kind == 'CronJob' ? (has(object.spec.jobTemplate.spec.template.metadata) ? object.spec.jobTemplate.spec.template.metadata : {}) :
      object.kind == 'ControllerRevision' ? (has(object.data) && has(object.data.spec) && has(object.data.spec.template) &&
        has(object.data.spec.template.metadata) ? object.data.spec.template.metadata : {}) :
      (has(object.spec.template) && has(object.spec.template.metadata) ? object.spec.template.metadata : {})
  - name: oldMeta
    expression: >-
      oldObject == null ? {} :
      oldObject.kind in ['Pod', 'Binding'] ? oldObject.metadata :
      oldObject.kind == 'CronJob' ? (has(oldObject.spec.jobTemplate.spec.template.metadata) ? oldObject.spec.jobTemplate.spec.template.metadata : {}) :
      oldObject.kind == 'ControllerRevision' ? (has(oldObject.data) && has(oldObject.data.spec) && has(oldObject.data.spec.template) &&
        has(oldObject.data.spec.template.metadata) ? oldObject.data.spec.template.metadata : {}) :
      (has(oldObject.spec.template) && has(oldObject.spec.template.metadata) ? oldObject.spec.template.metadata : {})
  # What runs: the Pod spec, or the pod template spec of a workload.
  - name: newSpec
    expression: >-
      object.kind == 'Binding' ? null :
      object.kind == 'Pod' ? object.spec :
      object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
      object.kind == 'ControllerRevision' ? (has(object.data) && has(object.data.spec) && has(object.data.spec.template) &&
        has(object.data.spec.template.spec) ? object.data.spec.template.spec : null) :
      (has(object.spec.template) && has(object.spec.template.spec) ? object.spec.template.spec : null)
  - name: oldSpec
    expression: >-
      oldObject == null || oldObject.kind == 'Binding' ? null :
      oldObject.kind == 'Pod' ? oldObject.spec :
      oldObject.kind == 'CronJob' ? oldObject.spec.jobTemplate.spec.template.spec :
      oldObject.kind == 'ControllerRevision' ? (has(oldObject.data) && has(oldObject.data.spec) && has(oldObject.data.spec.template) &&
        has(oldObject.data.spec.template.spec) ? oldObject.data.spec.template.spec : null) :
      (has(oldObject.spec.template) && has(oldObject.spec.template.spec) ? oldObject.spec.template.spec : null)
  # Reserved entries as "label key=value" / "annotation key=value". Keys
  # cannot contain '=', so the strings are unambiguous.
  - name: newReserved
    expression: >-
      (has(variables.newMeta.labels) ? variables.newMeta.labels.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'label ' + k + '=' + variables.newMeta.labels[k]) : []) +
      (has(variables.newMeta.annotations) ? variables.newMeta.annotations.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'annotation ' + k + '=' + variables.newMeta.annotations[k]) : [])
  - name: oldReserved
    expression: >-
      (has(variables.oldMeta.labels) ? variables.oldMeta.labels.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'label ' + k + '=' + variables.oldMeta.labels[k]) : []) +
      (has(variables.oldMeta.annotations) ? variables.oldMeta.annotations.map(k,
        k.startsWith('breakglass.telekom.com/debug-session') || k.startsWith('breakglass.telekom.com/ephemeral.'),
        'annotation ' + k + '=' + variables.oldMeta.annotations[k]) : [])
  # Ownership, selection and finalizers: changing them can detach a marked
  # ReplicaSet or Pod from the workload the controller cleans up, or hold the
  # workload after its delete, so it would outlive the session. Removing
  # finalizers stays allowed (the garbage collector does that).
  - name: newOwners
    expression: "has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []"
  - name: oldOwners
    expression: "oldObject == null || !has(oldObject.metadata.ownerReferences) ? [] : oldObject.metadata.ownerReferences"
  - name: newLabels
    expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  - name: oldLabels
    expression: "oldObject == null || !has(oldObject.metadata.labels) ? {} : oldObject.metadata.labels"
  - name: newSelector
    expression: "object.kind in ['Pod', 'Binding', 'ControllerRevision'] || !has(object.spec.selector) ? null : object.spec.selector"
  - name: oldSelector
    expression: "oldObject == null || oldObject.kind in ['Pod', 'Binding', 'ControllerRevision'] || !has(oldObject.spec.selector) ? null : oldObject.spec.selector"
  - name: newFinalizers
    expression: "has(object.metadata.finalizers) ? object.metadata.finalizers : []"
  - name: oldFinalizers
    expression: "oldObject == null || !has(oldObject.metadata.finalizers) ? [] : oldObject.metadata.finalizers"
  - name: exempt
    expression: >-
      request.userInfo.username in variables.controllerUsers ||
      (has(request.userInfo.groups) && request.userInfo.groups.exists(g, g in variables.controllerGroups)) ||
      request.userInfo.username in variables.workloadControllerUsers
  validations:
  # On DELETE there is no new object; only the last two validations apply.
  - expression: >-
      request.operation == 'DELETE' || variables.exempt ||
      (variables.newReserved.all(e, e in variables.oldReserved) &&
       variables.oldReserved.all(e, e in variables.newReserved))
    messageExpression: >-
      'labels and annotations with the prefixes breakglass.telekom.com/debug-session and breakglass.telekom.com/ephemeral. are reserved for the breakglass controller; '
      + request.userInfo.username + ' may not set, change or remove them'
    reason: Forbidden
  # Otherwise anyone who may edit a debug pod or workload could swap its image,
  # command or containers (including ephemeral containers) and run their own
  # code under the genuine session markers. Scaling and metadata edits stay
  # allowed.
  - expression: >-
      request.operation == 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      variables.newSpec == variables.oldSpec
    messageExpression: >-
      'the pod spec of a breakglass debug pod or debug workload template is reserved for the breakglass controller; '
      + request.userInfo.username + ' may not change it'
    reason: Forbidden
  - expression: >-
      request.operation == 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      (variables.newOwners == variables.oldOwners && variables.newLabels == variables.oldLabels &&
       variables.newSelector == variables.oldSelector &&
       variables.newFinalizers.all(f, f in variables.oldFinalizers))
    messageExpression: >-
      'the owner references, labels, selector and finalizers of a breakglass debug pod or debug workload are reserved for the breakglass controller; '
      + request.userInfo.username + ' may not change them'
    reason: Forbidden
  # Workload status (for example a StatefulSet's currentRevision) selects
  # which stored template the exempt controller creates Pods from; a partial
  # ControllerRevision without metadata would inherit the reserved labels.
  # Only the kube-controller-manager writes workload status.
  - expression: >-
      request.operation == 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      object.kind in ['Pod', 'Binding', 'ControllerRevision'] ||
      (has(object.status) ? object.status : null) == (has(oldObject.status) ? oldObject.status : null)
    messageExpression: >-
      'the status of a breakglass debug workload is reserved for the kube-controller-manager; '
      + request.userInfo.username + ' may not change it'
    reason: Forbidden
  # Orphaning deletes leave the marked children running after cleanup. The
  # garbage collector is exempt, so this must be refused at the delete
  # itself. Jobs and ReplicationControllers orphan by default, so an explicit
  # cascading policy is required for every kind (kubectl sends Background by
  # default).
  - expression: >-
      request.operation != 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      (request.options != null &&
       has(request.options.propagationPolicy) && request.options.propagationPolicy in ['Background', 'Foreground'] &&
       !(has(request.options.orphanDependents) && request.options.orphanDependents == true))
    messageExpression: >-
      'breakglass debug workloads may only be deleted with propagationPolicy Background or Foreground; ' + request.userInfo.username + ' may not orphan their Pods'
    reason: Forbidden
  # A StatefulSet finds its current ControllerRevision by name
  # (status.currentRevision) and applies the revision's data as a patch over
  # its own template. Deleting a marked revision would free the name for a
  # spec-only revision with another image, whose Pods the exempt StatefulSet
  # controller would create with the genuine labels. Only the exempt users
  # (the StatefulSet and DaemonSet controllers, the garbage collector and the
  # namespace controller) may delete one.
  - expression: >-
      request.operation != 'DELETE' || variables.exempt || variables.oldReserved.size() == 0 ||
      oldObject.kind != 'ControllerRevision'
    messageExpression: >-
      'the ControllerRevisions of breakglass debug workloads are reserved for the kube-controller-manager; '
      + request.userInfo.username + ' may not delete them'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: breakglass-runtime-label-reservation
  labels:
    app.kubernetes.io/name: breakglass
    app.kubernetes.io/component: admission
spec:
  policyName: breakglass-runtime-label-reservation
  validationActions: [Deny]
