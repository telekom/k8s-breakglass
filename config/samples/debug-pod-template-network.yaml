# Network Debug Pod Template
# Pre-built template for network troubleshooting with the standalone
# network-diagnostics image. Pin the reviewed release manifest by digest in
# production; the version tag is kept here so this sample follows releases.
apiVersion: breakglass.t-caas.telekom.com/v1alpha1
kind: DebugPodTemplate
metadata:
  name: network-debug
  annotations:
    breakglass.t-caas.telekom.com/deprecated: "true"
    breakglass.t-caas.telekom.com/deprecation-message: "Do not apply until an approved immutable network-debug image is supplied; use the disabled network-diagnostics catalogue profile."
    breakglass.t-caas.telekom.com/replacement: "debug-session-catalogue/network-diagnostics"
spec:
  displayName: "Network Debug"
  description: "Network diagnostics with NET_ADMIN and NET_RAW"
  template:
    metadata:
      labels:
        breakglass.t-caas.telekom.com/debug-type: network
      annotations:
        breakglass.t-caas.telekom.com/purpose: "Network troubleshooting"
    spec:
      hostNetwork: false
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: netdebug
        image: ghcr.io/telekom/k8s-breakglass-network-debug:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/net-debug"]
        args: ["shell"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN", "NET_RAW"]
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
