# Sample DebugPodTemplate - Basic debug container
# This template provides a minimal debug pod with common debugging tools
apiVersion: breakglass.t-caas.telekom.com/v1alpha1
kind: DebugPodTemplate
metadata:
  name: basic-debug
spec:
  displayName: "Basic Debug Pod"
  description: "Minimal debug container with common tools like curl, netcat, and dig"
  template:
    metadata:
      labels:
        app: breakglass-debug
        security-profile: baseline
    spec:
      containers:
        - name: debug
          # Immutable reference; replace with an approved catalogue image in production.
          image: ghcr.io/nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
---
# Sample DebugPodTemplate - Privileged debug container for node debugging
# DEPRECATED/QUARANTINED: this historical elevated example is retained only to
# document the old CRD shape. Do not apply it. Use the disabled, explicitly
# elevated `node-recovery` profile from charts/debug-session-catalogue instead.
apiVersion: breakglass.t-caas.telekom.com/v1alpha1
kind: DebugPodTemplate
metadata:
  name: privileged-debug
  annotations:
    breakglass.t-caas.telekom.com/deprecated: "true"
    breakglass.t-caas.telekom.com/deprecation-message: "Do not apply: use the disabled node-recovery catalogue profile with explicit elevation and approved images."
    breakglass.t-caas.telekom.com/replacement: "debug-session-catalogue/node-recovery"
spec:
  displayName: "Privileged Debug Pod"
  description: "Privileged container for node-level debugging with host access"
  template:
    metadata:
      labels:
        app: breakglass-debug
        security-profile: privileged
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: false
      containers:
        - name: debug
          image: ghcr.io/nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
---
# Sample DebugPodTemplate - Secure debug container
# This template provides a restricted debug container for production environments
apiVersion: breakglass.t-caas.telekom.com/v1alpha1
kind: DebugPodTemplate
metadata:
  name: secure-debug
spec:
  displayName: "Secure Debug Pod"
  description: "Restricted debug container for production environments with minimal privileges"
  template:
    metadata:
      labels:
        app: breakglass-debug
        security-profile: restricted
    spec:
      containers:
        - name: debug
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
