#
# LEGACY (unconstrained) impersonation for the breakglass RBAC probe.
#
# This grant is intentionally left as-is and is applied to every spoke. Removing
# it is NOT safe by default, and the reason is worth stating plainly:
#
#   On a spoke below Kubernetes 1.35, or with the ConstrainedImpersonation feature
#   gate disabled, the constrained rules in impersonate_constrained_role.yaml are
#   ACCEPTED by the API server but completely INERT. RBAC verbs and resources are
#   free-form strings, so nothing errors — the grant simply confers nothing. If this
#   legacy grant were stripped on such a spoke, the group-checker probe would stop
#   working and breakglass would silently stop authorizing anyone. A total outage,
#   reported as a successful rollout.
#
# So: keep this file on every spoke, and add impersonate_constrained_role.yaml
# alongside it. Breakglass detects per-spoke capability at runtime and prefers the
# constrained path where it works.
#
# The trade-off, and it is a real one: while this grant exists, a spoke that DOES
# support constrained impersonation can still fall back to it, because the API
# server falls back to legacy whenever every constrained mode denies. That makes
# the constraint decorative on that spoke.
#
# Retiring this grant on a spoke is a DELIBERATE, MANUALLY VERIFIED operation. There
# is no metric combination that is sufficient on its own to authorize it:
#
#   * `breakglass_impersonation_capability{support="supported"}` can be a false
#     positive where breakglass holds an over-broad grant on the spoke.
#   * `breakglass_impersonation_legacy_fallback_total` only counts what the webhook
#     saw, and the webhook sits AFTER RBAC in the authorizer chain — a legacy
#     impersonation that RBAC already allowed never reaches breakglass and is never
#     counted. A flat counter does not prove the legacy path is unused.
#
# Follow "Retiring the legacy grant on a spoke" in docs/constrained-impersonation.md,
# which verifies the gate from the spoke's own metrics, verifies the constrained RBAC
# with a SubjectAccessReview, and confirms via spoke audit that every impersonated
# request carries an `impersonationConstraint`. Then set
# `spec.constrainedImpersonation.support: Enabled` and
# `legacyFallback: Forbidden` on its ClusterConfig, remove this ClusterRole from that
# spoke only, and keep a rollback to hand.
#
# See docs/constrained-impersonation.md, sections "RBAC migration" and
# "Retiring the legacy grant on a spoke".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: "true"
    breakglass.t-caas.telekom.com/impersonation-mode: "legacy"
  labels:
    breakglass.t-caas.telekom.com/impersonation-mode: "legacy"
  name: impersonate-auth-manager-role
rules:
# Blanket impersonation in the CORE api group with no resourceNames. This is what
# constrained impersonation is designed to replace.
- apiGroups:
  - ""
  resources:
  - users
  - groups
  verbs:
  - impersonate
- apiGroups:
  - "authorization.k8s.io"
  resources:
  - selfsubjectaccessreviews
  verbs:
  - create
